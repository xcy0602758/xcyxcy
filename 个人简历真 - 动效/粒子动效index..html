<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粒子星球手势控制器</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: crosshair;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 用于MediaPipe输入的视频，隐藏 */
        #input-video {
            display: none;
        }

        /* UI 提示层 */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            color: rgba(255, 255, 255, 0.8);
            pointer-events: none;
            user-select: none;
        }

        h1 {
            margin: 0;
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 166, 0, 0.8);
        }

        .instruction {
            margin-top: 10px;
            font-size: 0.85rem;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 12px;
            border-radius: 8px;
            border-left: 3px solid #ffaa00;
        }

        .status {
            margin-top: 5px;
            font-weight: bold;
            color: #00ffcc;
            font-size: 0.9rem;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 20;
            text-align: center;
        }

        /* 摄像头预览小窗 */
        #webcam-preview {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 160px;
            height: 120px;
            z-index: 10;
            border: 2px solid #333;
            border-radius: 8px;
            opacity: 0.7;
            transform: scaleX(-1); /* 镜像翻转 */
        }

        /* 右上角 XCY Logo */
        #xcy-logo {
            position: absolute;
            top: 22px;
            right: 26px;
            z-index: 10;
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 6px;
            color: #00e5ff;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.9), 0 0 20px rgba(0, 229, 255, 0.5);
            opacity: 0.6;
            pointer-events: none;
            user-select: none;
            animation: xcyBreath 4s ease-in-out infinite;
        }

        @keyframes xcyBreath {
            0%, 100% { opacity: 0.42; }
            50% { opacity: 0.68; }
        }

        /* BGM 控制按钮 */
        #bgm-btn {
            position: absolute;
            bottom: 24px;
            left: 24px;
            z-index: 10;
            padding: 10px 16px;
            font-size: 0.85rem;
            color: #fff;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(0, 229, 255, 0.6);
            border-radius: 24px;
            cursor: pointer;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
            user-select: none;
        }

        #bgm-btn:hover {
            background: rgba(0, 229, 255, 0.15);
            box-shadow: 0 0 16px rgba(0, 229, 255, 0.6);
        }
    </style>

    <!-- 1. MediaPipe 依赖 (常规 Script 方式) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <!-- 2. Three.js Import Map for Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="loading">正在启动神经连接...<br><span style="font-size:14px; opacity:0.7">请允许摄像头权限</span></div>

    <div id="xcy-logo">XCY</div>

    <div id="ui-layer">
        <h1>粒子星云核心</h1>
        <div class="instruction">
            👋 <b>右手·旋转手掌</b>：旋转视角<br>
            ✊/✋ <b>右手·握拳/张开</b>：拉远 / 靠近<br>
            ✌️ ☝️ 🤏 🤘 <b>左手·手势</b>：触发音效与特效<br>
            🎵 <b>左下角按钮</b>：开启宇宙音乐与音效
        </div>
        <div id="gesture-status" class="status">等待手势...</div>
    </div>

    <!-- 隐藏的原始视频输入 -->
    <video id="input-video"></video>
    <!-- 用于反馈的小画布 -->
    <canvas id="webcam-preview"></canvas>
    <!-- 主3D场景 -->
    <div id="canvas-container"></div>

    <!-- BGM 开关 -->
    <button id="bgm-btn">🎵 开启宇宙音乐</button>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ==========================================
        // 1. 全局变量与配置
        // ==========================================
        const CONFIG = {
            planetColor: 0xff6600,
            particleCount: 8000,
            ringParticleCount: 4000,
            minDistance: 120,
            maxDistance: 2000,
            defaultDistance: 300,
            rotationSpeedMultiplier: 0.05
        };

        let scene, camera, renderer, composer, bloomPass;
        let planetSystem, ringSystem1, ringSystem2;
        let clock = new THREE.Clock();
        let time = 0;

        // 相机控制状态
        const cameraState = {
            radius: CONFIG.defaultDistance,
            theta: Math.PI / 2,
            phi: 0,
            zoomVelocity: 0,
            targetRadius: CONFIG.defaultDistance,
            isFist: false,
            isOpen: false,
            handRotation: 0
        };

        // 鼠标视差
        const pointer = { x: 0, y: 0 };

        // 相机震动
        let cameraShake = 0;

        // 特效列表 & 闪光脉冲
        const effects = [];
        let bloomPulse = 0;

        // 需要每帧更新时间 uniform 的材质
        const animatedMats = [];

        const statusEl = document.getElementById('gesture-status');
        const loadingEl = document.getElementById('loading');

        // ==========================================
        // 2. Three.js 初始化与场景构建
        // ==========================================

        // 生成圆形渐变 Canvas 纹理（用于 burst 特效）
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,255,255,0.85)');
            gradient.addColorStop(0.5, 'rgba(255,255,255,0.25)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        }

        // 自定义粒子 Shader（呼吸闪烁 + 每粒子颜色 + 尺寸衰减）
        function createParticleShaderMaterial(opacity) {
            const mat = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uPixelRatio: { value: renderer.getPixelRatio() },
                    uOpacity: { value: opacity }
                },
                vertexShader: `
                    attribute float aSize;
                    attribute float aPhase;
                    attribute vec3 aColor;
                    uniform float uTime;
                    uniform float uPixelRatio;
                    varying float vTwinkle;
                    varying vec3 vColor;
                    void main() {
                        vec4 mv = modelViewMatrix * vec4(position, 1.0);
                        float tw = 0.55 + 0.45 * sin(uTime * 1.6 + aPhase * 6.28318);
                        vTwinkle = tw;
                        vColor = aColor;
                        gl_PointSize = aSize * uPixelRatio * (320.0 / max(1.0, -mv.z));
                        gl_Position = projectionMatrix * mv;
                    }
                `,
                fragmentShader: `
                    uniform float uOpacity;
                    varying float vTwinkle;
                    varying vec3 vColor;
                    void main() {
                        vec2 p = gl_PointCoord - vec2(0.5);
                        float d = length(p);
                        float a = smoothstep(0.5, 0.0, d);
                        a = a * a;
                        a *= vTwinkle * uOpacity;
                        if (a < 0.01) discard;
                        gl_FragColor = vec4(vColor, a);
                    }
                `,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });
            animatedMats.push(mat);
            return mat;
        }

        // 通过位置/尺寸/相位/颜色数组构建 Points
        function buildPoints(positions, sizes, phases, colors, mat) {
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute('aSize', new THREE.Float32BufferAttribute(sizes, 1));
            geo.setAttribute('aPhase', new THREE.Float32BufferAttribute(phases, 1));
            geo.setAttribute('aColor', new THREE.Float32BufferAttribute(colors, 3));
            return new THREE.Points(geo, mat);
        }

        function initThree() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 4000);
            camera.position.set(0, 0, CONFIG.defaultDistance);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 后期处理 (Bloom 发光)
            const renderScene = new RenderPass(scene, camera);
            bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0;
            bloomPass.strength = 1.8;
            bloomPass.radius = 0.5;

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            const particleTexture = createParticleTexture();

            // --- 星球（彩色脉动粒子） ---
            const planetPos = [], planetSizes = [], planetPhases = [], planetColors = [];
            for (let i = 0; i < CONFIG.particleCount; i++) {
                const u = Math.random();
                const v = Math.random();
                const theta = 2 * Math.PI * u;
                const phi = Math.acos(2 * v - 1);

                let r = 50;
                if (Math.random() > 0.8) r = 50 * Math.random();

                const x = r * Math.sin(phi) * Math.cos(theta);
                const y = r * Math.sin(phi) * Math.sin(theta);
                const z = r * Math.cos(phi);

                planetPos.push(x, y, z);
                planetSizes.push(Math.random() * 2.4 + 1.2);
                planetPhases.push(Math.random());

                // 橙色系渐变：橙 -> 红 -> 黄 -> 亮白
                const c = new THREE.Color();
                const pick = Math.random();
                if (pick < 0.5) c.setHSL(0.045 + Math.random() * 0.05, 1.0, 0.45 + Math.random() * 0.25);
                else if (pick < 0.8) c.setHSL(0.0 + Math.random() * 0.03, 1.0, 0.5 + Math.random() * 0.3);
                else c.setHSL(0.12 + Math.random() * 0.04, 0.9, 0.65 + Math.random() * 0.3);
                planetColors.push(c.r, c.g, c.b);
            }

            planetSystem = buildPoints(
                planetPos, planetSizes, planetPhases, planetColors,
                createParticleShaderMaterial(0.95)
            );
            scene.add(planetSystem);

            // --- 星环 ---
            const createRing = (radiusInner, radiusOuter, count, tiltX, tiltZ, hue) => {
                const pos = [], sizes = [], phases = [], colors = [];
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const r = THREE.MathUtils.lerp(radiusInner, radiusOuter, Math.random());
                    const x = r * Math.cos(angle);
                    const y = (Math.random() - 0.5) * 2.5;
                    const z = r * Math.sin(angle);
                    pos.push(x, y, z);
                    sizes.push(Math.random() * 1.6 + 0.8);
                    phases.push(Math.random());
                    const c = new THREE.Color().setHSL(hue + (Math.random() - 0.5) * 0.03, 0.7, 0.75 + Math.random() * 0.2);
                    colors.push(c.r, c.g, c.b);
                }
                const sys = buildPoints(pos, sizes, phases, colors, createParticleShaderMaterial(0.55));
                sys.rotation.x = tiltX;
                sys.rotation.z = tiltZ;
                return sys;
            };

            ringSystem1 = createRing(70, 110, CONFIG.ringParticleCount, Math.PI / 3, Math.PI / 6, 0.55);
            ringSystem2 = createRing(80, 150, CONFIG.ringParticleCount, -Math.PI / 4, -Math.PI / 8, 0.6);
            scene.add(ringSystem1);
            scene.add(ringSystem2);

            // --- 背景星空（大球壳，闪烁） ---
            const starPos = [], starSizes = [], starPhases = [], starColors = [];
            const STAR_COUNT = 1600;
            for (let i = 0; i < STAR_COUNT; i++) {
                const dir = new THREE.Vector3(
                    Math.random() * 2 - 1,
                    Math.random() * 2 - 1,
                    Math.random() * 2 - 1
                ).normalize();
                const rr = 1000 + Math.random() * 600;
                starPos.push(dir.x * rr, dir.y * rr, dir.z * rr);
                starSizes.push(Math.random() * 1.6 + 0.7);
                starPhases.push(Math.random());
                const c = new THREE.Color().setHSL(
                    Math.random() < 0.1 ? 0.55 : 0.6, Math.random() < 0.3 ? 0.4 : 0.15,
                    0.7 + Math.random() * 0.3
                );
                starColors.push(c.r, c.g, c.b);
            }
            const starField = buildPoints(starPos, starSizes, starPhases, starColors, createParticleShaderMaterial(0.9));
            scene.add(starField);

            // --- 彩色星云尘埃（柔和光晕，缓慢漂移） ---
            const createNebula = (hue, radius, count, sizeScale) => {
                const pos = [], sizes = [], phases = [], colors = [];
                for (let i = 0; i < count; i++) {
                    const dir = new THREE.Vector3(
                        Math.random() * 2 - 1,
                        Math.random() * 2 - 1,
                        Math.random() * 2 - 1
                    ).normalize();
                    const rr = radius * (0.3 + Math.random() * 0.7);
                    pos.push(dir.x * rr, dir.y * rr, dir.z * rr * 0.6);
                    sizes.push((Math.random() * 20 + 8) * sizeScale);
                    phases.push(Math.random());
                    const c = new THREE.Color().setHSL(hue + (Math.random() - 0.5) * 0.05, 0.75, 0.35 + Math.random() * 0.3);
                    colors.push(c.r, c.g, c.b);
                }
                return buildPoints(pos, sizes, phases, colors, createParticleShaderMaterial(0.28));
            };

            const nebula1 = createNebula(0.75, 900, 500, 1.0);  // 紫
            const nebula2 = createNebula(0.52, 1100, 500, 1.2); // 青蓝
            const nebula3 = createNebula(0.08, 1200, 400, 1.1); // 橙红
            scene.add(nebula1, nebula2, nebula3);

            window.nebulaRefs = { nebula1, nebula2, nebula3, starField };

            // 事件
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointermove', (e) => {
                pointer.x = (e.clientX / window.innerWidth - 0.5) * 2;
                pointer.y = (e.clientY / window.innerHeight - 0.5) * 2;
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            const pr = renderer.getPixelRatio();
            animatedMats.forEach(m => { if (m && m.uniforms && m.uniforms.uPixelRatio) m.uniforms.uPixelRatio.value = pr; });
        }

        // ==========================================
        // 3. 特效系统（手势触发的粒子爆发 / 冲击波）
        // ==========================================

        function spawnBurst(color, count = 140, speed = 90, origin = new THREE.Vector3(0, 0, 0)) {
            const mat = new THREE.PointsMaterial({
                color, size: 3.5, map: createParticleTexture(),
                transparent: true, opacity: 1,
                blending: THREE.AdditiveBlending, depthWrite: false
            });
            const pos = new Float32Array(count * 3);
            const vel = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                pos[i * 3] = origin.x;
                pos[i * 3 + 1] = origin.y;
                pos[i * 3 + 2] = origin.z;
                const dir = new THREE.Vector3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1).normalize();
                const sp = speed * (0.3 + Math.random() * 0.7);
                vel[i * 3] = dir.x * sp;
                vel[i * 3 + 1] = dir.y * sp;
                vel[i * 3 + 2] = dir.z * sp;
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const pts = new THREE.Points(geo, mat);
            scene.add(pts);
            effects.push({ type: 'burst', pts, vel, life: 0, maxLife: 1.4, mat, drag: 0.96 });
        }

        function spawnShockwave(color) {
            const count = 120;
            const radii = new Float32Array(count);
            for (let i = 0; i < count; i++) radii[i] = 0;
            const mat = new THREE.PointsMaterial({
                color, size: 4, map: createParticleTexture(),
                transparent: true, opacity: 1,
                blending: THREE.AdditiveBlending, depthWrite: false
            });
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            const angles = new Float32Array(count);
            for (let i = 0; i < count; i++) {
                angles[i] = (i / count) * Math.PI * 2;
                pos[i * 3] = 0; pos[i * 3 + 1] = 0; pos[i * 3 + 2] = 0;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const pts = new THREE.Points(geo, mat);
            pts.lookAt(camera.position); // 环面朝向相机
            scene.add(pts);
            effects.push({ type: 'shock', pts, angles, radii, mat, life: 0, maxLife: 1.2, geo });
        }

        const GESTURE_EFFECTS = {
            open:  { color: 0x7df9ff, shake: 0,   burst: true,  label: '星云脉冲' },
            fist:  { color: 0xff5500, shake: 6,   burst: false, label: '震荡波' },
            peace: { color: 0x39ff14, shake: 0,   burst: true,  label: '召唤流星' },
            point: { color: 0xffffff, shake: 2,   burst: true,  label: '激光穿刺' },
            pinch: { color: 0xbf5fff, shake: 0,   burst: true,  label: '量子捕获' },
            rock:  { color: 0xff2255, shake: 5,   burst: false, label: '宇宙摇滚' }
        };

        function spawnGestureEffect(gesture) {
            const cfg = GESTURE_EFFECTS[gesture];
            if (!cfg) return;
            bloomPulse = Math.max(bloomPulse, 0.9);
            if (cfg.shake) cameraShake = cfg.shake;
            if (cfg.burst) spawnBurst(cfg.color, 150, 100);
            else spawnShockwave(cfg.color);
        }

        function updateEffects(dt) {
            for (let i = effects.length - 1; i >= 0; i--) {
                const e = effects[i];
                e.life += dt;
                if (e.life >= e.maxLife) {
                    scene.remove(e.pts);
                    e.pts.geometry.dispose();
                    e.mat.dispose();
                    effects.splice(i, 1);
                    continue;
                }
                const fade = 1 - e.life / e.maxLife;
                e.mat.opacity = fade;
                const attr = e.pts.geometry.attributes.position;
                const arr = attr.array;
                if (e.type === 'burst') {
                    for (let j = 0; j < arr.length; j += 3) {
                        e.vel[j] *= e.drag;
                        e.vel[j + 1] *= e.drag;
                        e.vel[j + 2] *= e.drag;
                        arr[j] += e.vel[j] * dt;
                        arr[j + 1] += e.vel[j + 1] * dt;
                        arr[j + 2] += e.vel[j + 2] * dt;
                    }
                } else if (e.type === 'shock') {
                    for (let j = 0; j < e.radii.length; j++) {
                        e.radii[j] += 140 * dt;
                        arr[j * 3] = Math.cos(e.angles[j]) * e.radii[j];
                        arr[j * 3 + 1] = Math.sin(e.angles[j]) * e.radii[j];
                        arr[j * 3 + 2] = 0;
                    }
                }
                attr.needsUpdate = true;
            }
        }

        // ==========================================
        // 4. 动画与相机逻辑
        // ==========================================

        function updateCamera(dt) {
            // 1. 旋转（根据手势）
            if (Math.abs(cameraState.handRotation) > 0.1) {
                cameraState.phi += cameraState.handRotation * CONFIG.rotationSpeedMultiplier;
            }

            // 2. 缩放（握拳 vs 张开）
            if (cameraState.isFist) {
                cameraState.zoomVelocity += 0.5;
            } else if (cameraState.isOpen) {
                cameraState.targetRadius = CONFIG.minDistance;
                const diff = cameraState.radius - CONFIG.minDistance;
                cameraState.zoomVelocity = -diff * 0.05;
            } else {
                cameraState.zoomVelocity *= 0.9;
            }
            cameraState.radius += cameraState.zoomVelocity;
            if (cameraState.radius < CONFIG.minDistance) {
                cameraState.radius = CONFIG.minDistance;
                cameraState.zoomVelocity = 0;
            }
            if (cameraState.radius > CONFIG.maxDistance) cameraState.radius = CONFIG.maxDistance;

            // 3. 自动环绕漂移（无手势时更明显）
            if (!cameraState.isFist && !cameraState.isOpen && Math.abs(cameraState.handRotation) < 0.1) {
                cameraState.phi -= 0.06 * dt;
                cameraState.theta = Math.PI / 2 + Math.sin(time * 0.3) * 0.08;
            }

            // 4. 球坐标转笛卡尔
            let px = cameraState.radius * Math.sin(cameraState.theta) * Math.sin(cameraState.phi);
            let py = cameraState.radius * Math.cos(cameraState.theta);
            let pz = cameraState.radius * Math.sin(cameraState.theta) * Math.cos(cameraState.phi);

            // 相机震动
            if (cameraShake > 0.01) {
                px += (Math.random() - 0.5) * cameraShake;
                py += (Math.random() - 0.5) * cameraShake;
                pz += (Math.random() - 0.5) * cameraShake;
                cameraShake *= 0.88;
            }

            camera.position.set(px, py, pz);

            // 鼠标视差：轻微偏移注视点
            camera.lookAt(pointer.x * 45, pointer.y * 20, 0);
        }

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.05);
            time += dt;

            // 更新时间 uniform
            animatedMats.forEach(m => { if (m && m.uniforms && m.uniforms.uTime) m.uniforms.uTime.value = time; });

            // 星球自转 + 呼吸
            if (planetSystem) {
                planetSystem.rotation.y = time * 0.12;
                planetSystem.rotation.x = Math.sin(time * 0.2) * 0.08;
            }
            if (ringSystem1) ringSystem1.rotation.z -= 0.3 * dt;
            if (ringSystem2) ringSystem2.rotation.z += 0.45 * dt;
            if (ringSystem1) ringSystem1.rotation.y += 0.1 * dt;
            if (ringSystem2) ringSystem2.rotation.y -= 0.08 * dt;

            // 背景缓慢旋转
            const nb = window.nebulaRefs;
            if (nb) {
                nb.nebula1.rotation.y += 0.01 * dt;
                nb.nebula2.rotation.y -= 0.008 * dt;
                nb.nebula3.rotation.y += 0.012 * dt;
                nb.starField.rotation.y -= 0.006 * dt;
            }

            updateEffects(dt);

            // Bloom 脉冲衰减
            bloomPass.strength = 1.8 + bloomPulse;
            bloomPulse *= 0.93;

            updateCamera(dt);

            composer.render();
        }

        // ==========================================
        // 5. 音频引擎（程序化 BGM + 手势音效）
        // ==========================================

        const AudioEngine = (() => {
            let ctx = null;
            let masterGain, bgmGain, sfxGain;
            let bgmStarted = false;
            let nextChordTime = 0;
            let chordIndex = 0;
            const bgmNodes = [];

            // 和弦进行（Dm / Bb / F / G —— D 小调，暗色宇宙感）
            const chords = [
                [73.42, 146.83, 174.61, 220.00, 293.66, 349.23],
                [58.27, 116.54, 174.61, 233.08, 293.66, 349.23],
                [43.65, 87.31, 130.81, 174.61, 220.00, 261.63],
                [49.00, 98.00, 146.83, 196.00, 246.94, 293.66]
            ];
            let noiseBuffer = null;

            function ensureCtx() {
                if (ctx) return ctx;
                ctx = new (window.AudioContext || window.webkitAudioContext)();

                masterGain = ctx.createGain();
                masterGain.gain.value = 0.9;
                masterGain.connect(ctx.destination);

                // 混响（卷积）
                const reverb = ctx.createConvolver();
                reverb.buffer = createImpulse(3.5, 2.8);
                const revGain = ctx.createGain();
                revGain.gain.value = 0.55;

                bgmGain = ctx.createGain();
                bgmGain.gain.value = 0.0;

                // BGM 主低通（呼吸感）
                const padFilter = ctx.createBiquadFilter();
                padFilter.type = 'lowpass';
                padFilter.frequency.value = 800;
                padFilter.Q.value = 0.6;
                bgmGain.connect(padFilter);
                padFilter.connect(masterGain);
                padFilter.connect(reverb); reverb.connect(revGain); revGain.connect(masterGain);

                // BGM 呼吸 LFO 调制滤波
                const lfo = ctx.createOscillator();
                lfo.frequency.value = 0.05;
                const lfoGain = ctx.createGain();
                lfoGain.gain.value = 350;
                lfo.connect(lfoGain);
                lfoGain.connect(padFilter.frequency);
                lfo.start();

                sfxGain = ctx.createGain();
                sfxGain.gain.value = 0.5;
                sfxGain.connect(masterGain);
                sfxGain.connect(reverb);

                // 低频持续嗡鸣
                const sub = ctx.createOscillator();
                sub.type = 'sine';
                sub.frequency.value = 36.71; // D1
                const subGain = ctx.createGain();
                subGain.gain.value = 0.14;
                sub.connect(subGain);
                subGain.connect(bgmGain);
                sub.start();
                bgmNodes.push({ stop: () => sub.stop() });

                noiseBuffer = createNoise();
                return ctx;
            }

            function createImpulse(duration, decay) {
                const rate = ctx.sampleRate;
                const length = Math.floor(rate * duration);
                const impulse = ctx.createBuffer(2, length, rate);
                for (let ch = 0; ch < 2; ch++) {
                    const data = impulse.getChannelData(ch);
                    for (let i = 0; i < length; i++) {
                        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
                    }
                }
                return impulse;
            }

            function createNoise() {
                const length = ctx.sampleRate * 1;
                const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
                return buffer;
            }

            function scheduleChord(start, chord, dur) {
                chord.forEach((f, idx) => {
                    const osc = ctx.createOscillator();
                    osc.type = idx === 0 ? 'sine' : idx < 2 ? 'triangle' : 'sawtooth';
                    osc.frequency.value = f;
                    osc.detune.value = (Math.random() - 0.5) * 8;
                    const g = ctx.createGain();
                    const amp = idx === 0 ? 0.12 : 0.05 / (idx + 1);
                    g.gain.setValueAtTime(0.0001, start);
                    g.gain.linearRampToValueAtTime(amp, start + dur * 0.4);
                    g.gain.linearRampToValueAtTime(0.0001, start + dur);
                    const flt = ctx.createBiquadFilter();
                    flt.type = 'lowpass';
                    flt.frequency.value = 500 + idx * 120;
                    osc.connect(flt); flt.connect(g); g.connect(bgmGain);
                    osc.start(start);
                    osc.stop(start + dur + 0.2);
                });
            }

            function scheduleArp(start, chord, dur) {
                const step = dur / 5;
                for (let i = 0; i < 5; i++) {
                    const f = chord[(i * 2 + 1) % chord.length] * 2; // 高八度琶音
                    const t = start + i * step + Math.random() * 0.15;
                    const osc = ctx.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.value = f;
                    const g = ctx.createGain();
                    g.gain.setValueAtTime(0.0001, t);
                    g.gain.linearRampToValueAtTime(0.045, t + 1.2);
                    g.gain.linearRampToValueAtTime(0.0001, t + 3.5);
                    osc.connect(g); g.connect(bgmGain);
                    osc.start(t);
                    osc.stop(t + 3.6);
                }
            }

            function runScheduler() {
                if (!bgmStarted) return;
                const now = ctx.currentTime;
                while (nextChordTime < now + 3) {
                    const chord = chords[chordIndex % chords.length];
                    const dur = 8;
                    scheduleChord(nextChordTime, chord, dur);
                    scheduleArp(nextChordTime, chord, dur);
                    chordIndex++;
                    nextChordTime += dur;
                }
            }

            function toggleBgm() {
                if (!ensureCtx()) return false;
                if (ctx.state === 'suspended') ctx.resume();
                bgmStarted = !bgmStarted;
                if (bgmStarted) {
                    nextChordTime = ctx.currentTime + 0.1;
                    chordIndex = 0;
                }
                const target = bgmStarted ? 0.32 : 0.0;
                bgmGain.gain.cancelScheduledValues(ctx.currentTime);
                bgmGain.gain.setTargetAtTime(target, ctx.currentTime, 0.8);
                return bgmStarted;
            }

            // ---- 手势音效 ----
            function playTone(freqStart, freqEnd, type, dur, amp, t) {
                const osc = ctx.createOscillator();
                osc.type = type;
                osc.frequency.setValueAtTime(freqStart, t);
                osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), t + dur);
                const g = ctx.createGain();
                g.gain.setValueAtTime(0.0001, t);
                g.gain.linearRampToValueAtTime(amp, t + 0.02);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                osc.connect(g); g.connect(sfxGain);
                osc.start(t); osc.stop(t + dur + 0.05);
            }

            function playNoise(dur, amp, freqStart, freqEnd, type, t) {
                const src = ctx.createBufferSource();
                src.buffer = noiseBuffer;
                src.loop = true;
                const flt = ctx.createBiquadFilter();
                flt.type = type || 'bandpass';
                flt.frequency.setValueAtTime(freqStart, t);
                flt.frequency.exponentialRampToValueAtTime(Math.max(50, freqEnd), t + dur);
                flt.Q.value = 1.2;
                const g = ctx.createGain();
                g.gain.setValueAtTime(0.0001, t);
                g.gain.linearRampToValueAtTime(amp, t + 0.03);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                src.connect(flt); flt.connect(g); g.connect(sfxGain);
                src.start(t); src.stop(t + dur + 0.05);
            }

            function playSfx(type) {
                if (!ctx || ctx.state === 'suspended') return;
                const t = ctx.currentTime;
                switch (type) {
                    case 'open':
                        playNoise(0.8, 0.25, 400, 5000, 'bandpass', t);
                        playTone(500, 1200, 'sine', 0.5, 0.12, t);
                        break;
                    case 'fist':
                        playTone(180, 45, 'sine', 0.45, 0.4, t);
                        playNoise(0.2, 0.2, 900, 200, 'lowpass', t);
                        break;
                    case 'peace':
                        playTone(659.25, 659.25, 'triangle', 0.9, 0.2, t);
                        playTone(987.77, 987.77, 'sine', 0.9, 0.15, t + 0.05);
                        playTone(1318.5, 1318.5, 'sine', 0.9, 0.1, t + 0.1);
                        break;
                    case 'point':
                        playTone(1400, 300, 'sawtooth', 0.18, 0.2, t);
                        playNoise(0.12, 0.18, 3000, 800, 'lowpass', t);
                        break;
                    case 'pinch':
                        [800, 1200, 1600, 2000].forEach((f, i) => {
                            playTone(f, f, 'sine', 0.25, 0.1, t + i * 0.04);
                        });
                        break;
                    case 'rock':
                        [110, 164.81, 220, 277.18].forEach((f, i) => {
                            playTone(f, f, 'sawtooth', 0.55, 0.09, t + i * 0.02);
                        });
                        break;
                }
            }

            return { toggleBgm, playSfx, runScheduler, ensureCtx, isStarted: () => bgmStarted };
        })();

        // 每 400ms 调度一次和弦
        setInterval(() => AudioEngine.runScheduler(), 400);

        // BGM 按钮
        const bgmBtn = document.getElementById('bgm-btn');
        bgmBtn.addEventListener('click', () => {
            const on = AudioEngine.toggleBgm();
            bgmBtn.textContent = on ? '🔇 关闭宇宙音乐' : '🎵 开启宇宙音乐';
        });

        // 任意点击/按键都尝试唤醒音频上下文
        window.addEventListener('pointerdown', () => { if (AudioEngine.ensureCtx()) AudioEngine.ensureCtx().resume(); });
        window.addEventListener('keydown', () => { if (AudioEngine.ensureCtx()) AudioEngine.ensureCtx().resume(); });

        // ==========================================
        // 6. MediaPipe Hands 集成（双手 + 多种手势）
        // ==========================================

        const previewCanvas = document.getElementById('webcam-preview');
        const previewCtx = previewCanvas.getContext('2d');

        // 手指关键点索引
        const FINGERS = {
            thumb:  { tip: 4, pip: 3, mcp: 2 },
            index:  { tip: 8, pip: 6, mcp: 5 },
            middle: { tip: 12, pip: 10, mcp: 9 },
            ring:   { tip: 16, pip: 14, mcp: 13 },
            pinky:  { tip: 20, pip: 18, mcp: 17 }
        };

        const dist = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y);

        function isExtended(lms, finger, wrist) {
            const tip = lms[finger.tip];
            const pip = lms[finger.pip];
            return dist(tip, wrist) > dist(pip, wrist) * 1.05;
        }

        function classifyGesture(lms) {
            const wrist = lms[0];
            const index = isExtended(lms, FINGERS.index, wrist);
            const middle = isExtended(lms, FINGERS.middle, wrist);
            const ring = isExtended(lms, FINGERS.ring, wrist);
            const pinky = isExtended(lms, FINGERS.pinky, wrist);
            const thumb = isExtended(lms, FINGERS.thumb, wrist);
            const extended = [index, middle, ring, pinky].filter(Boolean).length;

            // 捏合：拇指尖与食指尖很近，且拇指伸出（避免握拳误判）
            const pinch = thumb && (dist(lms[4], lms[8]) < 0.07);
            if (pinch) return 'pinch';

            if (extended === 0) return 'fist';
            if (extended === 4) return 'open';
            if (index && middle && !ring && !pinky) return 'peace';
            if (index && !middle && !ring && !pinky) return 'point';
            if (index && pinky && !middle && !ring) return 'rock';
            return 'none';
        }

        const GESTURE_NAME = {
            open: '✋ 张开',
            fist: '✊ 握拳',
            peace: '✌️ 和平',
            point: '☝️ 指向',
            pinch: '🤏 捏合',
            rock: '🤘 摇滚',
            none: '—'
        };

        // 手势变化触发（带冷却，避免音效轰炸）
        const lastGesture = ['none', 'none'];
        let lastTriggerTime = 0;

        function triggerOnChange(handIdx, gesture, isNavHand) {
            if (gesture === 'none' || gesture === lastGesture[handIdx]) {
                lastGesture[handIdx] = gesture;
                return;
            }
            lastGesture[handIdx] = gesture;
            // 右手负责导航，挥舞(open/fist)不触发音效，避免噪音
            if (isNavHand && (gesture === 'open' || gesture === 'fist')) return;
            const now = performance.now();
            if (now - lastTriggerTime < 350) return;
            lastTriggerTime = now;
            AudioEngine.playSfx(gesture);
            spawnGestureEffect(gesture);
        }

        function onResults(results) {
            previewCtx.save();
            previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
            previewCtx.drawImage(results.image, 0, 0, previewCanvas.width, previewCanvas.height);

            const hands = results.multiHandLandmarks || [];

            if (hands.length === 0) {
                cameraState.handRotation = 0;
                cameraState.isFist = false;
                cameraState.isOpen = false;
                lastGesture[0] = 'none';
                lastGesture[1] = 'none';
                statusEl.innerText = '未检测到手';
                statusEl.style.color = '#888';
                previewCtx.restore();
                return;
            }

            // 绘制所有手
            hands.forEach((lms, i) => {
                drawConnectors(previewCtx, lms, HAND_CONNECTIONS, { color: i === 0 ? '#00FF00' : '#FFAA00', lineWidth: 2 });
                drawLandmarks(previewCtx, lms, { color: i === 0 ? '#FF0000' : '#00AAFF', lineWidth: 1, radius: 2 });
            });

            // 右手（第一只）：导航
            const h0 = hands[0];
            const g0 = classifyGesture(h0);
            const wrist0 = h0[0];
            const middle0 = h0[9];
            const dx = middle0.x - wrist0.x;
            cameraState.handRotation = dx * -5.0;

            if (g0 === 'fist') { cameraState.isFist = true; cameraState.isOpen = false; }
            else if (g0 === 'open') { cameraState.isFist = false; cameraState.isOpen = true; }
            else { cameraState.isFist = false; cameraState.isOpen = false; }

            triggerOnChange(0, g0, true);

            // 左手（第二只）：特效手势
            let g1 = 'none';
            if (hands.length >= 2) {
                g1 = classifyGesture(hands[1]);
                triggerOnChange(1, g1, false);
            }

            const part = hands.length >= 2
                ? `右手: ${GESTURE_NAME[g0]} ｜ 左手: ${GESTURE_NAME[g1]}`
                : `右手: ${GESTURE_NAME[g0]}`;
            statusEl.innerText = '状态: ' + part;
            statusEl.style.color = hands.length >= 2 ? '#ffaa00' : '#00ffcc';

            previewCtx.restore();
        }

        function initMediaPipe() {
            const videoElement = document.getElementById('input-video');

            const hands = new window.Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onResults);

            const cameraUtils = new window.Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 640,
                height: 480
            });

            cameraUtils.start()
                .then(() => {
                    loadingEl.style.display = 'none';
                })
                .catch(err => {
                    loadingEl.innerHTML = '摄像头启动失败: ' + err;
                });

            previewCanvas.width = 160;
            previewCanvas.height = 120;
        }

        // ==========================================
        // 7. 启动
        // ==========================================
        initThree();
        animate();
        setTimeout(initMediaPipe, 1000);
    </script>
</body>
</html>
