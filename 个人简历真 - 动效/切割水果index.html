<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>切水果 · 手势切割水果</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#000;
      --hud: rgba(180, 240, 255, .92);
      --hud2: rgba(180, 240, 255, .55);
      --line: rgba(180, 240, 255, .18);
      --grid: rgba(180, 240, 255, .08);
      --ok: rgba(110, 255, 220, .95);
      --warn: rgba(255, 200, 120, .95);
      --bad: rgba(255, 120, 120, .95);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      overflow: hidden;
      color: white;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      overscroll-behavior: none;
    }

    #stage { position: fixed; inset: 0; background: #000; }
    canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    /* ===== HUD ===== */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      font-family: var(--mono);
      color: var(--hud);
      mix-blend-mode: screen;
    }
    #hud .frame {
      position: absolute;
      inset: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 0 0 1px rgba(0,0,0,.35) inset, 0 0 22px rgba(110,255,220,.06);
    }
    #hud .grid {
      position: absolute;
      inset: 16px;
      border-radius: 16px;
      background:
        linear-gradient(to right, var(--grid) 1px, transparent 1px) 0 0 / 40px 40px,
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px) 0 0 / 40px 40px;
      opacity: .55;
      mask-image: radial-gradient(circle at 50% 45%, rgba(0,0,0,1) 0%, rgba(0,0,0,.95) 40%, rgba(0,0,0,.2) 75%, rgba(0,0,0,0) 100%);
    }
    .corner { position: absolute; width: 34px; height: 34px; border: 2px solid var(--line); }
    .tl { left: 16px; top: 16px; border-right: 0; border-bottom: 0; border-top-left-radius: 16px; }
    .tr { right: 16px; top: 16px; border-left: 0; border-bottom: 0; border-top-right-radius: 16px; }
    .bl { left: 16px; bottom: 16px; border-right: 0; border-top: 0; border-bottom-left-radius: 16px; }
    .br { right: 16px; bottom: 16px; border-left: 0; border-top: 0; border-bottom-right-radius: 16px; }

    #scanlines {
      position: absolute;
      inset: 0;
      opacity: 0;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(180,240,255,.08),
          rgba(180,240,255,.08) 1px,
          rgba(0,0,0,0) 5px,
          rgba(0,0,0,0) 10px
        );
      mix-blend-mode: screen;
      animation: scanMove 2.2s linear infinite;
      transition: opacity .18s ease;
    }
    @keyframes scanMove{ 0%{ transform: translateY(-12%);} 100%{ transform: translateY(12%);} }
    #hud.tracking #scanlines { opacity: .22; }

    #status {
      position: absolute;
      left: calc(30px + env(safe-area-inset-left));
      top: calc(28px + env(safe-area-inset-top));
      display: grid;
      gap: 10px;
      max-width: min(720px, calc(100vw - 60px));
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid rgba(180,240,255,.18);
      background: rgba(6, 16, 22, .38);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 0 18px rgba(110,255,220,.05);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(180,240,255,.92);
    }
    .dot {
      width: 8px; height: 8px; border-radius: 999px;
      background: var(--warn);
      box-shadow: 0 0 12px rgba(255,200,120,.35);
    }
    .dot.ok { background: var(--ok); box-shadow: 0 0 14px rgba(110,255,220,.38); }
    .dot.bad{ background: var(--bad); box-shadow: 0 0 14px rgba(255,120,120,.38); }

    #readouts {
      display: grid;
      gap: 6px;
      font-size: 11px;
      color: rgba(180,240,255,.65);
      letter-spacing: .07em;
      text-transform: uppercase;
    }
    #readouts b { color: rgba(180,240,255,.92); font-weight: 700; }

    #scoreboard {
      position: absolute;
      right: calc(30px + env(safe-area-inset-right));
      top: calc(74px + env(safe-area-inset-top));
      display: grid;
      gap: 10px;
      text-align: right;
    }

    /* XCY brand logo (top-right) */
    #xcy {
      position: absolute;
      right: calc(30px + env(safe-area-inset-right));
      top: calc(20px + env(safe-area-inset-top));
      font-family: 'Orbitron', var(--mono);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: .16em;
      color: rgba(180, 240, 255, .92);
      text-shadow:
        0 0 6px rgba(110, 255, 220, .55),
        0 0 16px rgba(110, 255, 220, .30);
      pointer-events: none;
      opacity: .5;
      animation: xcyBreath 2.4s ease-in-out infinite;
    }
    @keyframes xcyBreath {
      0%, 100% { opacity: .38; }
      50%      { opacity: .58; }
    }
    #scoreboard .big {
      font-size: 14px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255,255,255,.92);
    }
    #scoreboard .big span {
      color: rgba(110,255,220,.95);
      text-shadow: 0 0 14px rgba(110,255,220,.25);
    }
    #scoreboard .small {
      font-size: 11px;
      color: rgba(180,240,255,.62);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    /* camera frame */
    #camWrap {
      position: absolute;
      right: calc(26px + env(safe-area-inset-right));
      bottom: calc(26px + env(safe-area-inset-bottom));
      width: 260px;
      aspect-ratio: 4 / 3;
      border-radius: 16px;
      border: 1px solid rgba(180,240,255,.18);
      box-shadow: 0 0 28px rgba(110,255,220,.08);
      overflow: hidden;
      background: rgba(0,0,0,.55);
      pointer-events: none;
    }
    #camWrap .label, #camWrap .blade {
      position: absolute;
      top: 10px;
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(180,240,255,.14);
      padding: 6px 8px;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 3;
    }
    #camWrap .label { left: 10px; color: rgba(180,240,255,.82); }
    #camWrap .blade { right: 10px; color: rgba(255,255,255,.85); }
    video#cam {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: .92;
      filter: contrast(108%) saturate(110%) brightness(1.02);
    }
    canvas#camOverlay {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none;
    }
    #camWrap .scan {
      position: absolute;
      inset: -30% -10%;
      opacity: 0;
      background: linear-gradient(to bottom, transparent, rgba(110,255,220,.14), transparent);
      transform: translateY(-120%);
      z-index: 1;
    }
    #hud.tracking #camWrap .scan{
      opacity: .75;
      animation: camSweep 1.35s linear infinite;
    }
    @keyframes camSweep { 0%{ transform: translateY(-120%);} 100%{ transform: translateY(200%);} }

    /* start overlay */
    #overlay {
      position: fixed; inset: 0;
      display: grid; place-items: center;
      pointer-events: auto;
      background: #05060a;
      overflow-y: auto;
      overflow-x: hidden;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #overlay::before{
      content:"";
      position: absolute; inset: -30%;
      background:
        radial-gradient(circle at 20% 30%, rgba(110,255,220,.22), transparent 40%),
        radial-gradient(circle at 80% 25%, rgba(255,90,180,.20), transparent 42%),
        radial-gradient(circle at 72% 80%, rgba(255,200,90,.18), transparent 45%),
        radial-gradient(circle at 25% 78%, rgba(140,120,255,.18), transparent 45%);
      filter: blur(18px);
      animation: bgDrift 18s ease-in-out infinite alternate;
      z-index: 0;
    }
    #overlay::after{
      content:"";
      position: absolute; inset: 0;
      background:
        repeating-linear-gradient(to bottom, rgba(180,240,255,.05) 0 1px, transparent 1px 6px);
      mix-blend-mode: screen;
      opacity: .35;
      z-index: 0;
      pointer-events: none;
    }
    @keyframes bgDrift{
      0%   { transform: translate(0,0) scale(1); }
      100% { transform: translate(-4%,3%) scale(1.08); }
    }
    #card {
      position: relative; z-index: 1;
      width: min(760px, calc(100vw - 40px));
      border-radius: 20px;
      border: 1px solid rgba(180,240,255,.22);
      background: linear-gradient(160deg, rgba(10,16,24,.72), rgba(8,10,16,.52));
      box-shadow:
        0 0 0 1px rgba(110,255,220,.10) inset,
        0 0 60px rgba(110,255,220,.14),
        0 0 90px rgba(255,90,180,.10);
      padding: 22px 22px 18px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      font-family: var(--sans);
      color: rgba(255,255,255,.92);
      animation: cardFloat 6s ease-in-out infinite;
    }
    @keyframes cardFloat{
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-4px); }
    }
    #card h1{
      margin: 0 0 4px;
      font-size: 26px; font-weight: 800; letter-spacing: .01em;
      background: linear-gradient(90deg, #6effdc, #5ec8ff, #ff6fb5, #ffc56e, #6effdc);
      background-size: 220% 100%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: titleFlow 7s linear infinite;
    }
    @keyframes titleFlow{
      0%   { background-position: 0% 0; }
      100% { background-position: 220% 0; }
    }
    #card .accent{
      height: 2px; width: 64px; border-radius: 2px; margin: 4px 0 12px;
      background: linear-gradient(90deg, #6effdc, #ff6fb5);
      opacity: .9;
    }
    #card .chips{ display: flex; gap: 7px; margin: 0 0 12px; }
    #card .chips span{
      width: 12px; height: 12px; border-radius: 50%;
      box-shadow: 0 0 10px currentColor;
      animation: chipPulse 2.4s ease-in-out infinite;
    }
    @keyframes chipPulse{
      0%,100% { transform: scale(1); opacity: .85; }
      50%     { transform: scale(1.25); opacity: 1; }
    }
    #card p{ margin: 8px 0; font-size: 13px; line-height: 1.55; color: rgba(255,255,255,.75); }
    #card .row{ display:flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; align-items: center; justify-content: space-between; }
    #startBtn{
      pointer-events: auto;
      cursor: pointer;
      border: 1px solid rgba(110,255,220,.45);
      background: linear-gradient(135deg, rgba(110,255,220,.24), rgba(94,200,255,.16));
      color: #fff;
      border-radius: 14px;
      padding: 14px 22px;
      font-size: 15px; font-weight: 700;
      letter-spacing: .04em;
      box-shadow: 0 0 28px rgba(110,255,220,.18), 0 0 60px rgba(255,90,180,.10);
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    }
    #startBtn:hover{
      transform: translateY(-2px);
      background: linear-gradient(135deg, rgba(110,255,220,.34), rgba(94,200,255,.24));
      box-shadow: 0 0 36px rgba(110,255,220,.28), 0 0 70px rgba(255,90,180,.16);
    }
    #startBtn:active{ transform: translateY(0); }
    #note { font-family: var(--mono); font-size: 11px; color: rgba(180,240,255,.65); letter-spacing: .05em; max-width: 320px; }
    #note code{
      color: rgba(180,240,255,.90);
      background: rgba(180,240,255,.08);
      border: 1px solid rgba(180,240,255,.10);
      padding: 1px 6px;
      border-radius: 10px;
    }
    #banner {
      margin-top: 12px;
      display: none;
      font-family: var(--mono);
      font-size: 12px;
      color: rgba(255,255,255,.86);
      border: 1px solid rgba(255,200,120,.25);
      background: rgba(40, 20, 0, .35);
      padding: 10px 12px;
      border-radius: 14px;
    }
    #banner strong{ color: rgba(255,200,120,.95); }

    /* hit flash */
    #flash {
      position: fixed; inset: 0;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.22), rgba(110,255,220,.09) 18%, rgba(0,0,0,0) 52%);
      transition: opacity .10s ease;
      mix-blend-mode: screen;
    }
    #flash.on { opacity: 1; }

    /* game over */
    #gameOver {
      position: fixed; inset: 0;
      display: none; place-items: center;
      pointer-events: auto;
      background: radial-gradient(circle at 50% 40%, rgba(255,120,120,.10), rgba(0,0,0,.92) 60%, rgba(0,0,0,1) 100%);
      font-family: var(--sans);
    }
    #gameOver .box{
      width: min(560px, calc(100vw - 40px));
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.50);
      box-shadow: 0 0 42px rgba(255,120,120,.10);
      padding: 18px 18px 16px;
      color: rgba(255,255,255,.90);
    }
    #gameOver .box h2{ margin: 0 0 10px; }
    #restartBtn{
      margin-top: 12px;
      cursor:pointer;
      border: 1px solid rgba(180,240,255,.18);
      background: rgba(180,240,255,.08);
      color: rgba(255,255,255,.92);
      border-radius: 14px;
      padding: 10px 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    #menuBtn{
      margin-top: 8px;
      cursor:pointer;
      border: 1px solid rgba(255,255,255,.12);
      background: transparent;
      color: rgba(255,255,255,.72);
      border-radius: 14px;
      padding: 8px 12px;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    #menuBtn:hover{ color: rgba(255,255,255,.92); border-color: rgba(180,240,255,.25); }

    /* start card option pickers */
    #card .section{ margin-top: 14px; }
    #card .section-label{
      font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
      text-transform: uppercase; color: rgba(180,240,255,.7); margin-bottom: 8px;
    }
    .opt-grid{ display: grid; gap: 8px; }
    .opt-grid.cols-4{ grid-template-columns: repeat(4, 1fr); }
    .opt-grid.cols-2{ grid-template-columns: 1fr 1fr; }
    .optBtn{
      cursor: pointer; text-align: left;
      border: 1px solid rgba(180,240,255,.18);
      background: linear-gradient(160deg, rgba(180,240,255,.06), rgba(180,240,255,.02));
      color: rgba(255,255,255,.88);
      border-radius: 12px; padding: 10px 12px;
      font-family: var(--sans); font-size: 13px; line-height: 1.25;
      transition: border-color .15s ease, background .15s ease, transform .12s ease, box-shadow .15s ease;
      display: flex; flex-direction: column; gap: 2px;
    }
    .optBtn span{ font-size: 11px; color: rgba(180,240,255,.62); letter-spacing: .02em; }
    .optBtn:hover{ background: linear-gradient(160deg, rgba(180,240,255,.10), rgba(180,240,255,.04)); transform: translateY(-1px); }
    .optBtn.active{
      border-color: rgba(110,255,220,.55);
      background: linear-gradient(160deg, rgba(110,255,220,.18), rgba(94,200,255,.06));
      box-shadow: 0 0 18px rgba(110,255,220,.14);
    }
    .optBtn.active b{ color: rgba(110,255,220,.98); }

    /* timer */
    #scoreboard .timer{
      font-family: var(--mono);
      font-size: 22px; font-weight: 700;
      letter-spacing: .06em;
      color: rgba(255,255,255,.95);
      text-shadow: 0 0 14px rgba(110,255,220,.30);
    }
    #scoreboard .timer.warn{ color: rgba(255,200,120,.95); text-shadow: 0 0 14px rgba(255,200,120,.35); }
    #scoreboard .timer.bad{ color: rgba(255,120,120,.95); text-shadow: 0 0 14px rgba(255,120,120,.35); }

    /* game over mode line */
    #gameOver .mode-line{
      font-family: var(--mono); font-size: 11px; letter-spacing: .12em;
      text-transform: uppercase; color: rgba(180,240,255,.7);
      margin: -4px 0 10px;
    }

    @media (max-width: 720px){
      #camWrap{ width: 200px; right: 18px; bottom: 18px; }
      #status{ left: 20px; top: 20px; }
      #xcy{ right: 20px; top: 14px; font-size: 20px; }
      #scoreboard{ right: 20px; top: 56px; }
      .opt-grid.cols-4{ grid-template-columns: 1fr 1fr; }
      #scoreboard .timer{ font-size: 18px; }
    }

    /* landscape phones / very short screens */
    @media (max-height: 460px){
      #status{ left: 14px; top: 14px; font-size: 12px; }
      #status .pill{ padding: 5px 11px; font-size: 11px; }
      #status #readouts{ font-size: 11px; }
      #xcy{ right: 16px; top: 12px; font-size: 18px; }
      #scoreboard{ right: 16px; top: 44px; gap: 6px; }
      #scoreboard .big{ font-size: 15px; }
      #scoreboard .timer{ font-size: 16px; }
      #scoreboard .small{ font-size: 10px; }
      #camWrap{ width: 150px; height: 108px; right: 14px; bottom: 14px; }
      #card{ width: min(680px, calc(100vw - 32px)); padding: 16px 16px 14px; }
      #card h1{ font-size: 20px; }
      #card .chips{ margin-bottom: 8px; }
      #card p{ margin: 6px 0; font-size: 12px; }
      #card .section{ margin-top: 10px; }
      .optBtn{ padding: 8px 10px; font-size: 12px; }
      .optBtn span{ font-size: 10px; }
      #startBtn{ padding: 11px 16px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="gl"></canvas>

    <div id="hud">
      <div id="scanlines"></div>
      <div class="frame"></div>
      <div class="grid"></div>
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <div id="status">
        <div class="pill"><span class="dot" id="dot"></span><span id="scanText">扫描待机</span></div>
        <div id="readouts">
          <div>光刀：<b id="bladeState">关</b> · 手势：<b id="gestureText">—</b></div>
          <div>连击：<b id="comboText">x1</b> · 失误：<b id="missText">0/3</b></div>
        </div>
      </div>

      <div id="xcy">XCY</div>

      <div id="scoreboard">
        <div class="big">得分 <span id="scoreText">0</span></div>
        <div class="timer" id="timerText" style="display:none">--:--</div>
        <div class="small" id="fpsText">— 帧</div>
      </div>

      <div id="camWrap">
        <div class="scan"></div>
        <div class="label">摄像头</div>
        <div class="blade" id="camBlade">光刀关</div>
        <video id="cam" autoplay playsinline muted></video>
        <canvas id="camOverlay"></canvas>
      </div>
    </div>

    <div id="flash"></div>

    <div id="overlay">
      <div id="card">
        <h1>切水果 · 手势切割水果</h1>
        <div class="accent"></div>
        <div class="chips" aria-hidden="true">
          <span style="color:#6edc6e"></span>
          <span style="color:#e8b45a"></span>
          <span style="color:#ff5fae"></span>
          <span style="color:#ff6464"></span>
          <span style="color:#ffa640"></span>
          <span style="color:#b98c5a"></span>
          <span style="color:#ffe35a"></span>
          <span style="color:#ff4d6b"></span>
        </div>
        <p>挥动“光刀”切水果，避开炸弹。可选摄像头手势或触屏/鼠标操控。</p>

        <div class="section">
          <div class="section-label">游戏模式</div>
          <div class="opt-grid cols-4" id="modeGrid">
            <button class="optBtn active" data-mode="classic"><b>经典</b><span>3 次失误结束</span></button>
            <button class="optBtn" data-mode="arcade"><b>街机</b><span>60 秒限时</span></button>
            <button class="optBtn" data-mode="zen"><b>禅</b><span>90 秒放松</span></button>
            <button class="optBtn" data-mode="rush"><b>极速</b><span>连击狂飙</span></button>
          </div>
        </div>

        <div class="section">
          <div class="section-label">操控方式</div>
          <div class="opt-grid cols-2" id="ctrlGrid">
            <button class="optBtn active" data-ctrl="gesture"><b>手势</b><span>摄像头 · 张开手掌开刀 / 握拳关刀</span></button>
            <button class="optBtn" data-ctrl="pointer"><b>触屏 / 鼠标</b><span>滑动即可切割</span></button>
          </div>
        </div>

        <div class="row">
          <button id="startBtn">开始 · 启用摄像头</button>
          <div id="note">摄像头需 <code>https</code> 或 <code>http://localhost</code> 才能授权。</div>
        </div>
        <div id="banner"></div>
      </div>
    </div>

    <div id="gameOver">
      <div class="box">
        <h2>游戏结束</h2>
        <div class="mode-line" id="finalMode">经典模式</div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@latest/build/three.module.js";

    // ============================================================

    // ============================================================
    // Utils
    // ============================================================
    const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
    const lerp = (a,b,t)=>a+(b-a)*t;
    const nowMs = ()=>performance.now();

    function segCircle(p1, p2, c, r){
      const vx = p2.x - p1.x, vy = p2.y - p1.y;
      const wx = c.x - p1.x, wy = c.y - p1.y;
      const vv = vx*vx + vy*vy;
      if (vv < 1e-6) return ((wx*wx + wy*wy) <= r*r);
      let t = (wx*vx + wy*vy) / vv;
      t = clamp(t, 0, 1);
      const px = p1.x + t*vx, py = p1.y + t*vy;
      const dx = c.x - px, dy = c.y - py;
      return (dx*dx + dy*dy) <= r*r;
    }

    // ============================================================
    // Three.js
    // ============================================================
    let renderer, scene, camera, aspect;
    let root, sparksGroup;

    let bladeCursor;
    let trailMesh, trailMat, trailGeo;
    let trailWidth = CFG.TRAIL_WIDTH_BASE;

    // Fruit catalog: shape, spark color, size range (half-extent in world units)
    const FRUIT_DEFS = {
      watermelon: { shape:"round", color:{r:0.45,g:0.95,b:0.45}, size:[0.15,0.20] },
      cantaloupe: { shape:"round", color:{r:1.00,g:0.78,b:0.40}, size:[0.14,0.18] },
      dragonfruit:{ shape:"oval",  color:{r:1.00,g:0.45,b:0.70}, size:[0.12,0.16] },
      peach:      { shape:"round", color:{r:1.00,g:0.60,b:0.70}, size:[0.12,0.16] },
      apple:      { shape:"round", color:{r:1.00,g:0.35,b:0.25}, size:[0.11,0.15] },
      orange:     { shape:"round", color:{r:1.00,g:0.62,b:0.22}, size:[0.11,0.15] },
      kiwi:       { shape:"round", color:{r:0.85,g:0.55,b:0.25}, size:[0.10,0.13] },
      lemon:      { shape:"oval",  color:{r:1.00,g:0.92,b:0.35}, size:[0.10,0.13] },
      strawberry: { shape:"oval",  color:{r:1.00,g:0.30,b:0.42}, size:[0.09,0.12] },
    };
    const fruitTypes = Object.keys(FRUIT_DEFS);
    const fruitTex = new Map();
    const halfTexCache = new Map();
    let bombTex = null;
    let sparkTex = null;

    function screenToWorld(nx, ny){
      const x = lerp(-aspect, aspect, nx);
      const y = lerp(CFG.WORLD_Y, -CFG.WORLD_Y, ny);
      return { x, y };
    }

    function initThree(){
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
      renderer.setClearColor(CFG.BG, 1);
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, CFG.DPR_MAX));
      renderer.setSize(innerWidth, innerHeight, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(CFG.BG);

      root = new THREE.Group();
      scene.add(root);

      sparksGroup = new THREE.Group();
      scene.add(sparksGroup);

      initTextures();
      initBackdrop();
      initTrailRibbon();
      initBladeCursor();

      onResize();
      addEventListener("resize", onResize, { passive: true });
      // orientation change (mobile rotate) — fires before layout settles on iOS,
      // so re-measure now and again shortly after.
      addEventListener("orientationchange", ()=>{
        onResize();
        setTimeout(onResize, 120);
        setTimeout(onResize, 360);
      }, { passive: true });
      // mobile browser UI (address bar) can change the visual viewport
      if(window.visualViewport){
        window.visualViewport.addEventListener("resize", onResize, { passive: true });
      }
    }

    function onResize(){
      const w = Math.max(1, innerWidth);
      const h = Math.max(1, innerHeight);
      aspect = w / h;
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, CFG.DPR_MAX));
      renderer.setSize(w, h, false);

      camera = new THREE.OrthographicCamera(-aspect, aspect, CFG.WORLD_Y, -CFG.WORLD_Y, 0.01, 100);
      camera.position.set(0, 0, 10);
      camera.lookAt(0, 0, 0);

      const rect = camWrap.getBoundingClientRect();
      const dpr = Math.min(devicePixelRatio||1, 2);
      camOverlay.width = Math.floor(Math.max(1, rect.width) * dpr);
      camOverlay.height = Math.floor(Math.max(1, rect.height) * dpr);
    }

    function initBackdrop(){
      const N = 1500;
      const pos = new Float32Array(N*3);
      const col = new Float32Array(N*3);
      for(let i=0;i<N;i++){
        const x = (Math.random()*2-1) * aspect * 1.15;
        const y = (Math.random()*2-1) * 1.15;
        const z = -Math.random()*0.6;
        pos[i*3+0]=x; pos[i*3+1]=y; pos[i*3+2]=z;
        const c = 0.45 + Math.random()*0.35;
        col[i*3+0]=c; col[i*3+1]=c; col[i*3+2]=c;
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.BufferAttribute(pos,3));
      g.setAttribute("color", new THREE.BufferAttribute(col,3));
      const m = new THREE.PointsMaterial({
        size: 0.010,
        vertexColors: true,
        transparent: true,
        opacity: 0.55,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const pts = new THREE.Points(g,m);
      pts.position.z = -0.5;
      scene.add(pts);
    }

    // ============================================================
    // Ribbon Trail
    // ============================================================
    const trail = new Array(CFG.TRAIL_POINTS).fill(0).map(()=>({x:999,y:999,t:0}));
    let trailHead = 0;
    let lastTrailTime = 0;

    function initTrailRibbon(){
      const N = CFG.TRAIL_POINTS;
      const pos = new Float32Array(N * 2 * 3);
      const uv  = new Float32Array(N * 2 * 2);

      const idx = [];
      for(let i=0;i<N-1;i++){
        const a = i*2, b=a+1, c=a+2, d=a+3;
        idx.push(a,b,c,  b,d,c);
      }

      trailGeo = new THREE.BufferGeometry();
      trailGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      trailGeo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
      trailGeo.setIndex(idx);

      trailMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uAlpha: { value: 0.0 },
          uGlowK: { value: CFG.TRAIL_GLOW_K },
          uTaperPow: { value: CFG.TRAIL_TAPER_POW },
          uC1: { value: new THREE.Color(0.35, 0.95, 1.00) },
          uC2: { value: new THREE.Color(1.00, 1.00, 1.00) },
        },
        vertexShader: /*glsl*/`
          varying vec2 vUv;
          void main(){
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: /*glsl*/`
          uniform float uAlpha;
          uniform float uGlowK;
          uniform float uTaperPow;
          uniform vec3  uC1;
          uniform vec3  uC2;
          varying vec2 vUv;
          void main(){
            float d = abs(vUv.x - 0.5) * 2.0;
            float glow = exp(-uGlowK * d * d);
            float taper = pow(clamp(vUv.y, 0.0, 1.0), uTaperPow);
            vec3 col = mix(uC1, uC2, pow(taper, 0.75));
            float a = glow * taper * uAlpha;
            gl_FragColor = vec4(col * (glow*1.25 + 0.25), a);
          }
        `
      });

      trailMesh = new THREE.Mesh(trailGeo, trailMat);
      trailMesh.renderOrder = 10;
      scene.add(trailMesh);

      clearTrail();
    }

    function clearTrail(){
      const pos = trailGeo.getAttribute("position");
      const uv = trailGeo.getAttribute("uv");
      for(let i=0;i<CFG.TRAIL_POINTS;i++){
        pos.array[(i*2+0)*3+0] = 999;
        pos.array[(i*2+0)*3+1] = 999;
        pos.array[(i*2+0)*3+2] = 0.02;

        pos.array[(i*2+1)*3+0] = 999;
        pos.array[(i*2+1)*3+1] = 999;
        pos.array[(i*2+1)*3+2] = 0.02;

        const v = i/(CFG.TRAIL_POINTS-1);
        uv.array[(i*2+0)*2+0] = 0.0;
        uv.array[(i*2+0)*2+1] = v;
        uv.array[(i*2+1)*2+0] = 1.0;
        uv.array[(i*2+1)*2+1] = v;
      }
      pos.needsUpdate = true;
      uv.needsUpdate = true;
    }

    function pushTrailPoint(x, y, t){
      trail[trailHead].x = x;
      trail[trailHead].y = y;
      trail[trailHead].t = t;
      trailHead = (trailHead + 1) % trail.length;
      lastTrailTime = t;

      const pos = trailGeo.getAttribute("position");
      const uv = trailGeo.getAttribute("uv");
      const N = trail.length;

      for(let i=0;i<N;i++){
        const src = (trailHead - 1 - i + N) % N;
        const p0 = trail[(src + 1) % N];
        const p1 = trail[src];
        const p2 = trail[(src - 1 + N) % N];

        const x1 = p1.x, y1 = p1.y;

        let tx = (p0.x - p2.x);
        let ty = (p0.y - p2.y);
        const tl = Math.hypot(tx, ty) || 1.0;
        tx /= tl; ty /= tl;

        const nx = -ty, ny = tx;

        const v = 1.0 - (i/(N-1));
        const w = trailWidth * (0.25 + 0.75 * Math.pow(v, 0.9));

        const lx = x1 - nx*w, ly = y1 - ny*w;
        const rx = x1 + nx*w, ry = y1 + ny*w;

        const vi0 = i*2+0;
        const vi1 = i*2+1;

        pos.array[vi0*3+0] = lx;
        pos.array[vi0*3+1] = ly;
        pos.array[vi0*3+2] = 0.03;

        pos.array[vi1*3+0] = rx;
        pos.array[vi1*3+1] = ry;
        pos.array[vi1*3+2] = 0.03;

        uv.array[vi0*2+0] = 0.0;
        uv.array[vi0*2+1] = v;
        uv.array[vi1*2+0] = 1.0;
        uv.array[vi1*2+1] = v;
      }

      pos.needsUpdate = true;
      uv.needsUpdate = true;
    }

    function initBladeCursor(){
      bladeCursor = makeSprite(sparkTex);
      bladeCursor.scale.set(0.20, 0.20, 1);
      bladeCursor.material.color = new THREE.Color(0.45, 0.95, 1.0);
      bladeCursor.material.opacity = 0.0;
      bladeCursor.position.set(0, 0, 0.05);
      bladeCursor.renderOrder = 11;
      scene.add(bladeCursor);
    }

    // ============================================================
    // Procedural textures
    // ============================================================
    function makeCanvas(size=256){
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const ctx = c.getContext("2d");
      return { c, ctx };
    }
    function circle(ctx, x, y, r){
      ctx.beginPath();
      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.closePath();
    }

    function drawFruitTexture(type, size=256){
      const { c, ctx } = makeCanvas(size);
      ctx.clearRect(0,0,size,size);
      const def = FRUIT_DEFS[type] || { shape:"round" };
      const oval = (def.shape === "oval");
      const rx = oval ? size*0.42 : size*0.44;
      const ry = oval ? size*0.34 : size*0.44;

      // soft shadow rim
      ctx.save();
      ctx.translate(size/2, size/2);
      const sh = ctx.createRadialGradient(0,0,size*0.10, 0,0,size*0.50);
      sh.addColorStop(0, "rgba(0,0,0,0)");
      sh.addColorStop(1, "rgba(0,0,0,0.38)");
      ctx.fillStyle = sh;
      ctx.beginPath(); ctx.ellipse(0,0, rx*1.06, ry*1.06, 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(size/2, size/2);
      const bodyPath = ()=>{
        ctx.beginPath();
        ctx.ellipse(0,0, rx, ry, 0, 0, Math.PI*2);
      };
      const topHi = (col, a0, a1, r)=>{
        const h = ctx.createRadialGradient(-size*0.16,-size*0.18, size*0.02, -size*0.12,-size*0.10, size*0.30);
        h.addColorStop(0, col.replace("A", String(a0)));
        h.addColorStop(1, col.replace("A", "0"));
        ctx.fillStyle = h; circle(ctx, -size*0.12, -size*0.12, r||size*0.30); ctx.fill();
      };

      if(type === "watermelon"){
        const g = ctx.createRadialGradient(-size*0.14,-size*0.16, size*0.06, 0,0,size*0.58);
        g.addColorStop(0, "rgba(190,235,150,1)");
        g.addColorStop(0.30, "rgba(80,180,90,1)");
        g.addColorStop(0.78, "rgba(28,110,38,1)");
        g.addColorStop(1, "rgba(8,50,18,1)");
        ctx.fillStyle = g; bodyPath(); ctx.fill();
        // dark stripes
        ctx.save();
        bodyPath(); ctx.clip();
        ctx.globalAlpha = 0.85;
        ctx.strokeStyle = "rgba(12,55,20,1)";
        ctx.lineWidth = 9;
        for(let i=-5;i<=5;i++){
          ctx.beginPath();
          ctx.moveTo(i*size*0.085, -size*0.5);
          ctx.quadraticCurveTo(i*size*0.05, 0, i*size*0.085, size*0.5);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.restore();
        // stem
        ctx.strokeStyle = "rgba(90,60,30,1)"; ctx.lineWidth = 8; ctx.lineCap="round";
        ctx.beginPath(); ctx.moveTo(0,-ry); ctx.lineTo(size*0.02,-ry*1.08); ctx.stroke();
        topHi("rgba(255,255,255,A)",0.30,0, size*0.30);
      }

      if(type === "cantaloupe"){
        const g = ctx.createRadialGradient(-size*0.14,-size*0.16, size*0.06, 0,0,size*0.58);
        g.addColorStop(0, "rgba(255,240,200,1)");
        g.addColorStop(0.34, "rgba(232,180,90,1)");
        g.addColorStop(0.80, "rgba(170,110,40,1)");
        g.addColorStop(1, "rgba(90,55,18,1)");
        ctx.fillStyle = g; bodyPath(); ctx.fill();
        // netting pattern
        ctx.save();
        bodyPath(); ctx.clip();
        ctx.globalAlpha = 0.30;
        ctx.strokeStyle = "rgba(255,242,210,1)";
        ctx.lineWidth = 2;
        for(let i=0;i<26;i++){
          ctx.beginPath();
          const a = Math.random()*Math.PI*2;
          const r1 = Math.random()*0.36*size, r2 = r1 + (0.06+Math.random()*0.10)*size;
          ctx.moveTo(Math.cos(a)*r1, Math.sin(a)*r1*0.82);
          ctx.lineTo(Math.cos(a+(Math.random()-0.5))*r2, Math.sin(a+(Math.random()-0.5))*r2*0.82);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.restore();
        topHi("rgba(255,255,255,A)",0.30,0, size*0.30);
      }

      if(type === "dragonfruit"){
        const g = ctx.createRadialGradient(-size*0.12,-size*0.16, size*0.06, 0,0,size*0.58);
        g.addColorStop(0, "rgba(255,200,225,1)");
        g.addColorStop(0.30, "rgba(255,95,160,1)");
        g.addColorStop(0.80, "rgba(190,40,110,1)");
        g.addColorStop(1, "rgba(95,15,60,1)");
        ctx.fillStyle = g; bodyPath(); ctx.fill();
        // green scale bracts
        ctx.save();
        bodyPath(); ctx.clip();
        ctx.globalAlpha = 0.92;
        for(let i=0;i<14;i++){
          const a = (i/14)*Math.PI*2;
          const rr = 0.30*size + Math.random()*0.06*size;
          const px = Math.cos(a)*rr, py = Math.sin(a)*rr*0.82;
          ctx.save();
          ctx.translate(px,py); ctx.rotate(a+Math.PI/2);
          const gg = ctx.createLinearGradient(0,-size*0.10,0,size*0.10);
          gg.addColorStop(0, "rgba(140,220,110,1)");
          gg.addColorStop(1, "rgba(40,110,40,1)");
          ctx.fillStyle = gg;
          ctx.beginPath();
          ctx.moveTo(0,-size*0.10);
          ctx.quadraticCurveTo(size*0.06,0, 0,size*0.10);
          ctx.quadraticCurveTo(-size*0.04,0, 0,-size*0.10);
          ctx.fill();
          ctx.restore();
        }
        ctx.globalAlpha = 1;
        ctx.restore();
        topHi("rgba(255,255,255,A)",0.30,0, size*0.28);
      }

      if(type === "peach"){
        const g = ctx.createRadialGradient(-size*0.14,-size*0.16, size*0.06, 0,0,size*0.58);
        g.addColorStop(0, "rgba(255,220,210,1)");
        g.addColorStop(0.30, "rgba(255,150,170,1)");
        g.addColorStop(0.80, "rgba(210,90,120,1)");
        g.addColorStop(1, "rgba(120,40,60,1)");
        ctx.fillStyle = g; bodyPath(); ctx.fill();
        // crease
        ctx.save(); bodyPath(); ctx.clip();
        ctx.strokeStyle = "rgba(150,55,75,0.55)"; ctx.lineWidth = 7; ctx.lineCap="round";
        ctx.beginPath();
        ctx.moveTo(0,-ry*0.95);
        ctx.quadraticCurveTo(size*0.10,0, 0,ry*0.95);
        ctx.stroke();
        ctx.restore();
        // leaf
        ctx.fillStyle = "rgba(80,200,110,1)";
        ctx.beginPath(); ctx.ellipse(size*0.06,-ry*1.02, size*0.10, size*0.045, 0.4, 0, Math.PI*2); ctx.fill();
        topHi("rgba(255,255,255,A)",0.34,0, size*0.30);
      }

      if(type === "apple"){
        const g = ctx.createRadialGradient(-size*0.12,-size*0.15, size*0.06, 0,0,size*0.55);
        g.addColorStop(0, "rgba(255,255,255,0.25)");
        g.addColorStop(0.18, "rgba(255,90,90,1)");
        g.addColorStop(0.75, "rgba(175,25,25,1)");
        g.addColorStop(1, "rgba(90,10,10,1)");
        ctx.fillStyle = g; bodyPath(); ctx.fill();
        ctx.globalAlpha = 0.18; ctx.fillStyle = "rgba(255,220,220,1)";
        for(let i=0;i<48;i++){
          const a = Math.random()*Math.PI*2;
          const rr = (Math.random()**0.6)*size*0.33;
          circle(ctx, Math.cos(a)*rr, Math.sin(a)*rr*0.9, 1 + Math.random()*1.6); ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.rotate(-0.5);
        ctx.fillStyle = "rgba(80,210,110,1)";
        ctx.beginPath(); ctx.ellipse(size*0.07,-ry*0.95, size*0.10, size*0.05, 0.3, 0, Math.PI*2); ctx.fill();
        ctx.rotate(0.5);
        ctx.strokeStyle = "rgba(120,70,30,1)"; ctx.lineWidth = 9; ctx.lineCap="round";
        ctx.beginPath(); ctx.moveTo(0,-ry); ctx.lineTo(size*0.02,-ry*1.08); ctx.stroke();
        topHi("rgba(255,255,255,A)",0.35,0, size*0.30);
      }

      if(type === "orange"){
        const g = ctx.createRadialGradient(-size*0.14,-size*0.16, size*0.06, 0,0,size*0.58);
        g.addColorStop(0, "rgba(255,255,255,0.18)");
        g.addColorStop(0.22, "rgba(255,170,60,1)");
        g.addColorStop(0.75, "rgba(220,95,18,1)");
        g.addColorStop(1, "rgba(120,40,8,1)");
        ctx.fillStyle = g; bodyPath(); ctx.fill();
        ctx.globalAlpha = 0.22; ctx.fillStyle = "rgba(255,220,150,1)";
        for(let i=0;i<90;i++){
          const a = Math.random()*Math.PI*2;
          const rr = (Math.random()**0.7)*size*0.33;
          circle(ctx, Math.cos(a)*rr, Math.sin(a)*rr*0.9, 0.8 + Math.random()*1.4); ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle = "rgba(255,255,255,0.07)";
        circle(ctx, 0, -ry*0.92, size*0.07); ctx.fill();
        topHi("rgba(255,255,255,A)",0.28,0, size*0.30);
      }

      if(type === "kiwi"){
        const g = ctx.createRadialGradient(-size*0.14,-size*0.16, size*0.06, 0,0,size*0.58);
        g.addColorStop(0, "rgba(190,150,100,1)");
        g.addColorStop(0.45, "rgba(140,100,60,1)");
        g.addColorStop(1, "rgba(70,48,24,1)");
        ctx.fillStyle = g; bodyPath(); ctx.fill();
        // fuzzy fibers
        ctx.globalAlpha = 0.35; ctx.strokeStyle = "rgba(220,180,130,1)"; ctx.lineWidth = 1.4;
        for(let i=0;i<140;i++){
          const a = Math.random()*Math.PI*2;
          const rr = (Math.random()**0.5)*(rx*0.96);
          const x0 = Math.cos(a)*rr, y0 = Math.sin(a)*rr*0.9;
          ctx.beginPath(); ctx.moveTo(x0,y0);
          ctx.lineTo(x0+Math.cos(a)*3, y0+Math.sin(a)*3*0.9); ctx.stroke();
        }
        ctx.globalAlpha = 1;
        topHi("rgba(255,255,255,A)",0.22,0, size*0.26);
      }

      if(type === "lemon"){
        const g = ctx.createRadialGradient(-size*0.12,-size*0.16, size*0.06, 0,0,size*0.58);
        g.addColorStop(0, "rgba(255,255,255,0.18)");
        g.addColorStop(0.24, "rgba(255,235,90,1)");
        g.addColorStop(0.78, "rgba(215,175,18,1)");
        g.addColorStop(1, "rgba(120,95,10,1)");
        ctx.fillStyle = g; bodyPath(); ctx.fill();
        // textured pores
        ctx.globalAlpha = 0.25; ctx.fillStyle = "rgba(180,140,30,1)";
        for(let i=0;i<70;i++){
          const a = Math.random()*Math.PI*2;
          const rr = (Math.random()**0.6)*rx*0.9;
          circle(ctx, Math.cos(a)*rr, Math.sin(a)*rr*0.82, 0.8 + Math.random()*1.2); ctx.fill();
        }
        ctx.globalAlpha = 1;
        // little nub at tip
        ctx.fillStyle = "rgba(180,150,30,1)";
        circle(ctx, 0, ry*0.96, size*0.03); ctx.fill();
        topHi("rgba(255,255,255,A)",0.26,0, size*0.28);
      }

      if(type === "strawberry"){
        const g = ctx.createRadialGradient(-size*0.10,-size*0.10, size*0.05, 0,0,size*0.58);
        g.addColorStop(0, "rgba(255,150,170,1)");
        g.addColorStop(0.40, "rgba(235,55,75,1)");
        g.addColorStop(1, "rgba(140,20,35,1)");
        ctx.fillStyle = g; bodyPath(); ctx.fill();
        // seeds
        ctx.globalAlpha = 0.9; ctx.fillStyle = "rgba(255,235,160,1)";
        for(let i=0;i<22;i++){
          const a = Math.random()*Math.PI*2;
          const rr = (Math.random()**0.5)*rx*0.86;
          ctx.save();
          ctx.translate(Math.cos(a)*rr, Math.sin(a)*rr*0.82);
          ctx.rotate(a);
          ctx.beginPath();
          ctx.ellipse(0,0, size*0.022, size*0.012, 0, 0, Math.PI*2);
          ctx.fill();
          ctx.restore();
        }
        ctx.globalAlpha = 1;
        // green calyx leaves
        ctx.save();
        ctx.translate(0,-ry*0.95);
        for(let k=0;k<5;k++){
          ctx.save();
          ctx.rotate((k-2)*0.7);
          const gg = ctx.createLinearGradient(0,0,0,-size*0.18);
          gg.addColorStop(0, "rgba(90,200,100,1)");
          gg.addColorStop(1, "rgba(30,110,40,1)");
          ctx.fillStyle = gg;
          ctx.beginPath();
          ctx.moveTo(0,0);
          ctx.quadraticCurveTo(size*0.05,-size*0.10, 0,-size*0.20);
          ctx.quadraticCurveTo(-size*0.05,-size*0.10, 0,0);
          ctx.fill();
          ctx.restore();
        }
        ctx.restore();
        topHi("rgba(255,255,255,A)",0.30,0, size*0.26);
      }

      ctx.restore();

      // shape-aware alpha mask (soft edge)
      ctx.save();
      ctx.globalCompositeOperation = "destination-in";
      const m = ctx.createRadialGradient(size/2,size/2, size*0.08, size/2,size/2, size*0.50);
      m.addColorStop(0, "rgba(0,0,0,1)");
      m.addColorStop(0.93, "rgba(0,0,0,1)");
      m.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = m;
      ctx.beginPath();
      ctx.ellipse(size/2, size/2, size*0.50, oval ? size*0.42 : size*0.50, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();

      return c;
    }

    function drawBombTexture(size=256){
      const { c, ctx } = makeCanvas(size);
      ctx.clearRect(0,0,size,size);

      ctx.save();
      ctx.translate(size/2,size/2);

      const g = ctx.createRadialGradient(-size*0.12,-size*0.16, size*0.06, 0,0,size*0.58);
      g.addColorStop(0, "rgba(255,255,255,0.18)");
      g.addColorStop(0.22, "rgba(60,60,70,1)");
      g.addColorStop(0.78, "rgba(10,10,12,1)");
      g.addColorStop(1, "rgba(0,0,0,1)");
      ctx.fillStyle = g; circle(ctx,0,0,size*0.44); ctx.fill();

      ctx.strokeStyle = "rgba(255,80,80,0.9)";
      ctx.lineWidth = 10;
      ctx.beginPath(); ctx.arc(0,0,size*0.30,0,Math.PI*2); ctx.stroke();

      ctx.strokeStyle = "rgba(180,140,80,1)";
      ctx.lineWidth = 10; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(size*0.10, -size*0.40); ctx.lineTo(size*0.18, -size*0.52); ctx.stroke();

      ctx.fillStyle = "rgba(255,210,120,1)";
      circle(ctx, size*0.22, -size*0.56, size*0.04); ctx.fill();
      ctx.fillStyle = "rgba(255,120,80,1)";
      circle(ctx, size*0.26, -size*0.60, size*0.02); ctx.fill();

      const h = ctx.createRadialGradient(-size*0.18,-size*0.18, size*0.02, -size*0.12,-size*0.10, size*0.26);
      h.addColorStop(0, "rgba(255,255,255,0.22)");
      h.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = h; circle(ctx, -size*0.12, -size*0.12, size*0.30); ctx.fill();

      ctx.restore();

      ctx.save();
      ctx.globalCompositeOperation = "destination-in";
      const m = ctx.createRadialGradient(size/2,size/2, size*0.10, size/2,size/2, size*0.50);
      m.addColorStop(0, "rgba(0,0,0,1)");
      m.addColorStop(0.95, "rgba(0,0,0,1)");
      m.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = m;
      circle(ctx, size/2, size/2, size*0.50);
      ctx.fill();
      ctx.restore();

      return c;
    }

    function drawSparkTexture(size=128){
      const { c, ctx } = makeCanvas(size);
      ctx.clearRect(0,0,size,size);
      ctx.save();
      ctx.translate(size/2,size/2);
      const g = ctx.createRadialGradient(0,0, 0, 0,0, size*0.48);
      g.addColorStop(0, "rgba(255,255,255,0.95)");
      g.addColorStop(0.18, "rgba(255,255,255,0.45)");
      g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g;
      circle(ctx,0,0,size*0.48);
      ctx.fill();
      ctx.restore();
      return c;
    }

    function initTextures(){
      for(const t of fruitTypes){
        const cnv = drawFruitTexture(t, 256);
        const tex = new THREE.CanvasTexture(cnv);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = 4;
        fruitTex.set(t, tex);
      }
      bombTex = new THREE.CanvasTexture(drawBombTexture(256));
      bombTex.colorSpace = THREE.SRGBColorSpace;
      bombTex.anisotropy = 4;

      sparkTex = new THREE.CanvasTexture(drawSparkTexture(128));
      sparkTex.colorSpace = THREE.SRGBColorSpace;
      sparkTex.anisotropy = 2;
    }

    function getHalfTexture(type, side){
      const key = `${type}:${side}`;
      if(halfTexCache.has(key)) return halfTexCache.get(key);

      const base = drawFruitTexture(type, 256);
      const { c, ctx } = makeCanvas(256);
      ctx.clearRect(0,0,256,256);
      ctx.save();
      ctx.beginPath();
      if(side === "L") ctx.rect(0,0,128,256);
      else ctx.rect(128,0,128,256);
      ctx.clip();
      ctx.drawImage(base, 0, 0);
      ctx.restore();

      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = "rgba(255,255,255,0.22)";
      ctx.lineWidth = 6;
      ctx.beginPath();
      const x = 128;
      ctx.moveTo(x, 44);
      ctx.lineTo(x, 212);
      ctx.stroke();
      ctx.restore();

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      halfTexCache.set(key, tex);
      return tex;
    }

    // ============================================================
    // Sprites & game objects
    // ============================================================
    const fruits = [];
    const halves = [];
    const sparks = [];

    function makeSprite(texture){
      const mat = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        opacity: 1.0
      });
      const sp = new THREE.Sprite(mat);
      sp.position.z = 0;
      return sp;
    }

    function spawnFruit(isBomb=false){
      const type = isBomb ? "bomb" : fruitTypes[(Math.random()*fruitTypes.length)|0];
      const def = FRUIT_DEFS[type];
      const r = isBomb
        ? lerp(0.12, 0.16, Math.random())
        : lerp(def.size[0], def.size[1], Math.random());
      const x = (Math.random()*2 - 1) * (aspect * 0.85);
      const y = -CFG.WORLD_Y - 0.22;

      // ✅ lowered VY => peak won't exceed top
      const vy = lerp(CFG.LAUNCH_VY_MIN, CFG.LAUNCH_VY_MAX, Math.random());
      const vx = (Math.random()*2 - 1) * CFG.LAUNCH_VX;
      const spin = (Math.random()*2 - 1) * CFG.SPIN;

      const sprite = makeSprite(isBomb ? bombTex : fruitTex.get(type));
      sprite.scale.set(r*2, r*2, 1);
      sprite.position.set(x, y, 0);

      const obj = {
        isBomb,
        type,
        r,
        x, y,
        vx, vy,
        spin,
        rot: Math.random()*Math.PI*2,
        sliced: false,
        missable: !isBomb,
        sprite
      };
      sprite.material.rotation = obj.rot;

      root.add(sprite);
      fruits.push(obj);
    }

    function spawnHalves(fruit, cutDir){
      const nx = -cutDir.dy, ny = cutDir.dx;
      const push = fruit.r * 0.28;

      const leftTex = getHalfTexture(fruit.type, "L");
      const rightTex = getHalfTexture(fruit.type, "R");

      const a = makeSprite(leftTex);
      const b = makeSprite(rightTex);

      a.scale.set(fruit.r*2, fruit.r*2, 1);
      b.scale.set(fruit.r*2, fruit.r*2, 1);

      a.position.set(fruit.x - nx*push, fruit.y - ny*push, 0);
      b.position.set(fruit.x + nx*push, fruit.y + ny*push, 0);

      const baseVx = fruit.vx;
      const baseVy = fruit.vy;

      const kick = 0.85;
      const upKick = 0.35;

      const ha = {
        x: a.position.x, y: a.position.y,
        vx: baseVx - nx*kick, vy: baseVy - ny*kick + upKick,
        rot: fruit.rot, spin: fruit.spin * 1.1,
        life: 1.2, sprite: a
      };
      const hb = {
        x: b.position.x, y: b.position.y,
        vx: baseVx + nx*kick, vy: baseVy + ny*kick + upKick,
        rot: fruit.rot, spin: -fruit.spin * 1.05,
        life: 1.2, sprite: b
      };

      a.material.rotation = ha.rot;
      b.material.rotation = hb.rot;

      root.add(a);
      root.add(b);
      halves.push(ha, hb);
    }

    function fruitColor(type){
      const d = FRUIT_DEFS[type];
      if(d && d.color) return d.color;
      return { r: 0.95, g: 0.95, b: 1.0 };
    }

    function spawnSparks(x, y, color){
      for(let i=0;i<CFG.SPARKS_PER_SLICE;i++){
        const sp = makeSprite(sparkTex);
        sp.material.opacity = 0.0;
        sp.material.color = new THREE.Color(color.r, color.g, color.b);
        sp.scale.set(0.11, 0.11, 1);
        sp.position.set(x, y, 0.01);

        const a = Math.random()*Math.PI*2;
        const s = 0.65 + Math.random()*1.55;

        sparksGroup.add(sp);
        sparks.push({
          x, y,
          vx: Math.cos(a)*s*0.55,
          vy: Math.sin(a)*s*0.55 + 0.42,
          life: CFG.SPARK_LIFE,
          sprite: sp
        });
      }
    }

    // ============================================================
    // MediaPipe Hands
    // ============================================================
    let handLandmarker = null;
    let lastDetect = 0;

    const hand = {
      ready: false,
      detected: false,
      lastSeen: 0,
      fx: 0.5, fy: 0.5,
      fxT: 0.5, fyT: 0.5,
      wx: 0, wy: 0,
      gesture: "无",
      bladeOn: false
    };

    function bannerMsg(html){
      banner.style.display = "block";
      banner.innerHTML = html;
    }

    async function initMediaPipeAndCamera(){
      if(!window.isSecureContext){
        bannerMsg(`<strong>相机被阻止：</strong>当前不是安全上下文。请用 <code>https</code> 或 <code>http://localhost</code> 打开。`);
        throw new Error("Insecure context: camera blocked");
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 960 }, height: { ideal: 540 } },
        audio: false
      });
      camEl.srcObject = stream;
      await camEl.play();

      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
      );

      const modelUrl =
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task";

      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: modelUrl, delegate: "GPU" },
        runningMode: "VIDEO",
        numHands: 1,
        minHandDetectionConfidence: 0.55,
        minHandPresenceConfidence: 0.55,
        minTrackingConfidence: 0.55
      });

      hand.ready = true;
    }

    function d2(a,b){
      const dx = a.x-b.x, dy = a.y-b.y;
      return Math.hypot(dx,dy);
    }

    function classifyGesture(lm){
      const wrist = lm[0];
      const fingers = [
        { tip: 8,  mcp: 5 },
        { tip: 12, mcp: 9 },
        { tip: 16, mcp: 13 },
        { tip: 20, mcp: 17 },
      ];
      let extended = 0;
      for(const f of fingers){
        const tip = lm[f.tip];
        const mcp = lm[f.mcp];
        const r = d2(tip, wrist) / Math.max(1e-6, d2(mcp, wrist));
        if(r > 1.18) extended++;
      }
      if(extended >= CFG.OPEN_EXTENDED_MIN) return "张开";
      if(extended <= CFG.FIST_EXTENDED_MAX) return "握拳";
      return "其他";
    }

    function updateHand(result, t){
      const has = !!(result?.landmarks?.length);
      if(!has){
        if(hand.detected && (t - hand.lastSeen) > CFG.HAND_LOST_MS){
          hand.detected = false;
          hand.gesture = "无";
          hand.bladeOn = false;
        }
        return;
      }

      const lm = result.landmarks[0];
      const tip = lm[8];

      hand.fxT = 1.0 - tip.x;
      hand.fyT = tip.y;

      hand.fx = lerp(hand.fx, hand.fxT, CFG.HAND_SMOOTH);
      hand.fy = lerp(hand.fy, hand.fyT, CFG.HAND_SMOOTH);

      const w = screenToWorld(hand.fx, hand.fy);
      hand.wx = w.x;
      hand.wy = w.y;

      hand.gesture = classifyGesture(lm);
      if(hand.gesture === "张开") hand.bladeOn = true;
      else if(hand.gesture === "握拳") hand.bladeOn = false;
      else hand.bladeOn = true;

      hand.detected = true;
      hand.lastSeen = t;

      if (CFG.CAM_OVERLAY_POINTS) drawCamOverlay(lm, hand.bladeOn);
    }

    function drawCamOverlay(lm, bladeOn){
      const w = camOverlay.width, h = camOverlay.height;
      camCtx.clearRect(0,0,w,h);

      const key = [0, 5, 9, 13, 17, 8, 12, 16, 20];
      camCtx.save();
      camCtx.globalCompositeOperation = "lighter";

      for(const idx of key){
        const p = lm[idx];
        const x = (1 - p.x) * w;
        const y = p.y * h;

        const isTip = (idx === 8);
        const r = isTip ? 8 : 4;

        const g = camCtx.createRadialGradient(x,y,0, x,y,r*2.2);
        g.addColorStop(0, bladeOn ? "rgba(110,255,220,.95)" : "rgba(255,200,120,.85)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        camCtx.fillStyle = g;
        camCtx.beginPath();
        camCtx.arc(x,y,r*2.2,0,Math.PI*2);
        camCtx.fill();

        camCtx.fillStyle = bladeOn ? "rgba(220,255,248,.95)" : "rgba(255,235,210,.90)";
        camCtx.beginPath();
        camCtx.arc(x,y,r,0,Math.PI*2);
        camCtx.fill();
      }

      const tip = lm[8];
      const tx = (1 - tip.x) * w;
      const ty = tip.y * h;
      camCtx.globalAlpha = 0.55;
      camCtx.strokeStyle = bladeOn ? "rgba(110,255,220,.85)" : "rgba(255,200,120,.85)";
      camCtx.lineWidth = 1.5;
      camCtx.beginPath(); camCtx.moveTo(tx-10,ty); camCtx.lineTo(tx+10,ty); camCtx.stroke();
      camCtx.beginPath(); camCtx.moveTo(tx,ty-10); camCtx.lineTo(tx,ty+10); camCtx.stroke();

      camCtx.restore();
    }

    // ============================================================
    // Gameplay state
    // ============================================================
    let started = false;
    let running = false;
    let spawnTimer = 0;
    let spawnInterval = CFG.SPAWN_BASE;

    let score = 0;
    let combo = 1;
    let bestCombo = 1;
    let misses = 0;

    let currentMode = MODES.classic;
    let controlMode = "gesture";   // "gesture" | "pointer"
    let timeLeft = 0;
    let timerDisplaySec = -1;

    let prevHandWorld = { x: 0, y: 0 };
    let prevHandWorldValid = false;

    let fpsFrames = 0;
    let fpsLast = performance.now();

    function hitFlash(){
      flash.classList.add("on");
      setTimeout(()=>flash.classList.remove("on"), 85);
    }

    function fmtTime(s){
      s = Math.max(0, Math.ceil(s));
      const m = Math.floor(s / 60);
      const ss = s % 60;
      return `${m}:${String(ss).padStart(2, "0")}`;
    }

    function updateTimerDisplay(){
      if(currentMode.timeLimit > 0){
        const s = Math.max(0, Math.ceil(timeLeft));
        if(s !== timerDisplaySec){
          timerDisplaySec = s;
          timerText.textContent = fmtTime(s);
        }
        timerText.style.display = "";
        timerText.classList.toggle("warn", s <= 10 && s > 5);
        timerText.classList.toggle("bad", s <= 5);
      } else {
        timerText.style.display = "none";
      }
    }

    // Feed pointer (mouse/touch) input into the same hand pipeline
    function updatePointerHand(t){
      if((t - hand.lastSeen) > 350){
        hand.detected = false;
        hand.bladeOn = false;
        hand.gesture = "无";
      }
    }

    function onPointerMove(e){
      if(!started || controlMode !== "pointer") return;
      const rect = canvas.getBoundingClientRect();
      const nx = clamp((e.clientX - rect.left) / rect.width, 0, 1);
      const ny = clamp((e.clientY - rect.top) / rect.height, 0, 1);
      const w = screenToWorld(nx, ny);
      hand.fx = nx; hand.fy = ny;
      hand.wx = w.x; hand.wy = w.y;
      hand.detected = true;
      hand.bladeOn = true;
      hand.lastSeen = nowMs();
      hand.gesture = (e.pointerType === "touch") ? "触屏"
                   : (e.pointerType === "pen") ? "手写笔" : "鼠标";
    }

    function resetGame(){
      for(const f of fruits){ root.remove(f.sprite); f.sprite.material.dispose?.(); }
      fruits.length = 0;
      for(const h of halves){ root.remove(h.sprite); h.sprite.material.dispose?.(); }
      halves.length = 0;
      for(const s of sparks){ sparksGroup.remove(s.sprite); s.sprite.material.dispose?.(); }
      sparks.length = 0;

      score = 0;
      combo = 1;
      bestCombo = 1;
      misses = 0;

      spawnTimer = 0;
      spawnInterval = currentMode.spawnBase;
      timeLeft = currentMode.timeLimit;
      timerDisplaySec = -1;

      scoreText.textContent = "0";
      comboTextEl.textContent = "x1";
      missTextEl.textContent = currentMode.missLimit > 0 ? `0/${currentMode.missLimit}` : "—";
      updateTimerDisplay();

      // hide camera preview in pointer mode
      camWrap.style.display = controlMode === "gesture" ? "" : "none";

      clearTrail();
      prevHandWorldValid = false;
      // reset pointer hand state so a stale position doesn't auto-slice
      hand.detected = false;
      hand.bladeOn = false;

      running = true;
      gameOver.style.display = "none";
      flash.classList.remove("on");
    }

    function endGame(reason=""){
      running = false;
      finalScoreEl.textContent = String(score);
      bestComboEl.textContent = "x" + String(bestCombo);
      finalModeEl.textContent = currentMode.name;
      gameOver.style.display = "grid";
      scanText.textContent = reason ? reason : "游戏结束";
    }

    // ============================================================
    // Main loop
    // ============================================================
    const clock = new THREE.Clock();

    function step(dt){
      const t = nowMs();

      if(controlMode === "pointer"){
        updatePointerHand(t);
      } else if(handLandmarker && camEl.readyState >= 2 && (t - lastDetect) >= CFG.DETECT_EVERY_MS){
        lastDetect = t;
        const res = handLandmarker.detectForVideo(camEl, t);
        updateHand(res, t);
      } else {
        updateHand(null, t);
      }

      if(hand.detected){
        hud.classList.add("tracking");
        dot.classList.add("ok");
        dot.classList.remove("bad");
        scanText.textContent = "追踪中";
        gestureTextEl.textContent = hand.gesture;
      } else {
        hud.classList.remove("tracking");
        dot.classList.remove("ok");
        scanText.textContent = controlMode === "pointer"
          ? "等待输入"
          : (hand.ready ? "扫描待机" : "加载中…");
        gestureTextEl.textContent = "—";
      }

      const bladeOn = hand.detected && hand.bladeOn;

      bladeStateEl.textContent = bladeOn ? "开" : "关";
      bladeStateEl.style.color = bladeOn ? "rgba(110,255,220,.95)" : "rgba(255,200,120,.9)";
      camBlade.textContent = bladeOn ? "光刀开" : "光刀关";
      camBlade.style.borderColor = bladeOn ? "rgba(110,255,220,.25)" : "rgba(255,200,120,.25)";
      camBlade.style.color = bladeOn ? "rgba(110,255,220,.95)" : "rgba(255,200,120,.95)";

      bladeCursor.position.set(hand.wx, hand.wy, 0.05);
      bladeCursor.material.opacity = bladeOn ? 0.95 : 0.0;

      let sliceSeg = null;
      let sliceSpeed = 0;

      if(bladeOn){
        pushTrailPoint(hand.wx, hand.wy, t);

        if(!prevHandWorldValid){
          prevHandWorld.x = hand.wx;
          prevHandWorld.y = hand.wy;
          prevHandWorldValid = true;
        } else {
          const dx = hand.wx - prevHandWorld.x;
          const dy = hand.wy - prevHandWorld.y;
          const dist = Math.hypot(dx, dy);
          sliceSpeed = dist / Math.max(dt, 1e-6);
          sliceSeg = { p1:{x:prevHandWorld.x,y:prevHandWorld.y}, p2:{x:hand.wx,y:hand.wy}, dx,dy,dist };
          prevHandWorld.x = hand.wx;
          prevHandWorld.y = hand.wy;
        }
      } else {
        if((t - lastTrailTime) > CFG.TRAIL_FALLBACK_HIDE_MS) clearTrail();
        prevHandWorldValid = false;
      }

      const widthTarget = CFG.TRAIL_WIDTH_BASE
        + clamp(sliceSpeed, 0, 2.0) * CFG.TRAIL_WIDTH_SPEED
        + (combo - 1) * 0.006;   // trail grows with combo
      trailWidth = lerp(trailWidth, widthTarget, 0.22);
      trailMat.uniforms.uAlpha.value = bladeOn ? CFG.TRAIL_ALPHA_ON : CFG.TRAIL_ALPHA_OFF;
      // shift trail color from cyan -> gold as combo rises
      const ct = clamp((combo - 1) / 11, 0, 1);
      trailMat.uniforms.uC1.value.setRGB(
        lerp(0.35, 1.00, ct),
        lerp(0.95, 0.82, ct),
        lerp(1.00, 0.32, ct)
      );

      if(running){
        // timer countdown for time-limited modes
        if(currentMode.timeLimit > 0){
          timeLeft -= dt;
          if(timeLeft <= 0){
            timeLeft = 0;
            updateTimerDisplay();
            endGame("时间到");
          } else {
            updateTimerDisplay();
          }
        }

        spawnTimer += dt;
        if(spawnTimer >= spawnInterval){
          spawnTimer = 0;
          spawnInterval = Math.max(currentMode.spawnMin, spawnInterval * currentMode.difficultyRamp);

          const spawnCount = (Math.random() < currentMode.multiChance) ? 2 : 1;
          for(let i=0;i<spawnCount;i++){
            const isBomb = currentMode.bombs && (Math.random() < currentMode.bombChance);
            spawnFruit(isBomb);
          }
        }
      }

      // Update fruits
      for(let i=fruits.length-1; i>=0; i--){
        const f = fruits[i];

        f.vy += CFG.GRAVITY * dt;
        f.x += f.vx * dt;
        f.y += f.vy * dt;

        // ✅ HARD TOP CLAMP: never exceed top edge
        const topLimit = CFG.WORLD_Y - f.r - CFG.TOP_MARGIN;
        if(f.y > topLimit){
          f.y = topLimit;
          // nudge downward so it doesn't "stick" at the ceiling
          if(f.vy > 0) f.vy = -Math.abs(f.vy) * CFG.TOP_BOUNCE;
        }

        f.rot += f.spin * dt;

        f.sprite.position.x = f.x;
        f.sprite.position.y = f.y;
        f.sprite.material.rotation = f.rot;

        if(running && sliceSeg && !f.sliced && sliceSpeed > CFG.SLICE_SPEED_MIN){
          if(segCircle(sliceSeg.p1, sliceSeg.p2, {x:f.x,y:f.y}, f.r)){
            f.sliced = true;

            if(f.isBomb){
              hitFlash();
              root.remove(f.sprite);
              spawnSparks(f.x, f.y, { r: 1.0, g: 0.42, b: 0.30 });
              if(currentMode.bombEnds){
                endGame("炸弹爆炸");
              } else {
                if(currentMode.bombPenalty) score = Math.max(0, score - currentMode.bombPenalty);
                if(currentMode.bombComboReset) combo = 1;
                scoreText.textContent = String(score);
                comboTextEl.textContent = "x" + String(combo);
              }
            } else {
              root.remove(f.sprite);

              const dirLen = Math.max(1e-6, sliceSeg.dist);
              const dir = { dx: sliceSeg.dx/dirLen, dy: sliceSeg.dy/dirLen };
              spawnHalves(f, dir);
              spawnSparks(f.x, f.y, fruitColor(f.type));

              score += 10 * combo;
              combo = Math.min(12, combo + 1);
              bestCombo = Math.max(bestCombo, combo);

              scoreText.textContent = String(score);
              comboTextEl.textContent = "x" + String(combo);

              hitFlash();
            }

            fruits.splice(i,1);
            f.sprite.material.map = null;
            f.sprite.material.dispose?.();
          }
        }

        if(f.y < CFG.OUT_KILL_Y){
          root.remove(f.sprite);
          fruits.splice(i,1);
          f.sprite.material.map = null;
          f.sprite.material.dispose?.();

          if(running && f.missable && !f.sliced && currentMode.missLimit > 0){
            misses++;
            missTextEl.textContent = `${misses}/${currentMode.missLimit}`;
            combo = 1;
            comboTextEl.textContent = "x1";
            if(misses >= currentMode.missLimit) endGame("失误过多");
          }
        }
      }

      // halves
      for(let i=halves.length-1; i>=0; i--){
        const h = halves[i];
        h.vy += CFG.GRAVITY * dt;
        h.x += h.vx * dt;
        h.y += h.vy * dt;
        h.rot += h.spin * dt;
        h.life -= dt;

        const topLimit = CFG.WORLD_Y - (0.10) - CFG.TOP_MARGIN;
        if(h.y > topLimit && h.vy > 0) h.vy = -Math.abs(h.vy) * 0.10;

        h.sprite.position.x = h.x;
        h.sprite.position.y = h.y;
        h.sprite.material.rotation = h.rot;
        h.sprite.material.opacity = clamp(h.life/1.2, 0, 1);

        if(h.life <= 0 || h.y < CFG.OUT_KILL_Y - 0.3){
          root.remove(h.sprite);
          halves.splice(i,1);
          h.sprite.material.map = null;
          h.sprite.material.dispose?.();
        }
      }

      // sparks
      for(let i=sparks.length-1; i>=0; i--){
        const s = sparks[i];
        s.vy += (CFG.GRAVITY * 0.55) * dt;
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.life -= dt;

        const a = clamp(s.life / CFG.SPARK_LIFE, 0, 1);
        s.sprite.position.x = s.x;
        s.sprite.position.y = s.y;
        s.sprite.material.opacity = a * 0.90;

        const sc = 0.12 * (0.55 + a*0.75);
        s.sprite.scale.set(sc, sc, 1);

        if(s.life <= 0){
          sparksGroup.remove(s.sprite);
          sparks.splice(i,1);
          s.sprite.material.map = null;
          s.sprite.material.dispose?.();
        }
      }

      renderer.render(scene, camera);

      fpsFrames++;
      const n = performance.now();
      if(n - fpsLast > 500){
        const fps = (fpsFrames * 1000) / (n - fpsLast);
        fpsText.textContent = `${fps.toFixed(0)} 帧`;
        fpsFrames = 0;
        fpsLast = n;
      }
    }

    function animate(){
      requestAnimationFrame(animate);
      const dt = Math.min(0.033, clock.getDelta());
      if(started) step(dt);
    }

    // ============================================================
    // Start / Restart
    // ============================================================
    async function start(){
      try{
        banner.style.display = "none";
        startBtn.disabled = true;
        startBtn.textContent = "加载中…";

        if(controlMode === "gesture"){
          await initMediaPipeAndCamera();
        }

        overlay.style.display = "none";
        started = true;
        resetGame();

        dot.classList.remove("bad");
        dot.classList.remove("ok");
        scanText.textContent = controlMode === "pointer" ? "等待输入" : "扫描待机";
      } catch (e){
        console.error(e);
        startBtn.disabled = false;
        startBtn.textContent = controlMode === "gesture" ? "开始 · 启用摄像头" : "开始游戏";
        dot.classList.remove("ok");
        dot.classList.add("bad");
        scanText.textContent = controlMode === "gesture" ? "摄像头错误" : "启动失败";
        if(!banner.innerHTML){
          bannerMsg(`<strong>启动失败：</strong>${String(e)}<br/>请确认你在 <code>https</code> 或 <code>http://localhost</code> 打开，并允许相机权限。`);
        }
      }
    }

    // ---- mode / control pickers ----
    function selectMode(m){
      if(!MODES[m]) return;
      currentMode = MODES[m];
      modeGrid.querySelectorAll(".optBtn").forEach(b=>{
        b.classList.toggle("active", b.dataset.mode === m);
      });
    }
    function selectCtrl(c){
      controlMode = c;
      ctrlGrid.querySelectorAll(".optBtn").forEach(b=>{
        b.classList.toggle("active", b.dataset.ctrl === c);
      });
      startBtn.textContent = c === "gesture" ? "开始 · 启用摄像头" : "开始游戏";
      note.style.display = c === "gesture" ? "" : "none";
      // hide camera preview when not using gestures
      camWrap.style.display = c === "gesture" ? "" : "none";
    }
    modeGrid.querySelectorAll(".optBtn").forEach(b=>{
      b.addEventListener("click", ()=> selectMode(b.dataset.mode));
    });
    ctrlGrid.querySelectorAll(".optBtn").forEach(b=>{
      b.addEventListener("click", ()=> selectCtrl(b.dataset.ctrl));
    });

    // ---- pointer (mouse / touch) input ----
    addEventListener("pointermove", onPointerMove, { passive: true });
    addEventListener("pointerdown", onPointerMove, { passive: true });

    startBtn.addEventListener("click", start);
    restartBtn.addEventListener("click", ()=> resetGame());
    menuBtn.addEventListener("click", ()=>{
      gameOver.style.display = "none";
      overlay.style.display = "grid";
      banner.style.display = "none";
      started = false;
      running = false;
      startBtn.disabled = false;
      startBtn.textContent = controlMode === "gesture" ? "开始 · 启用摄像头" : "开始游戏";
    });

    // ============================================================
    // Boot
    // ============================================================
    initThree();
    animate();
  </script>
</body>
</html>
