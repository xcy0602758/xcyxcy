  // ==================== 音效系统（Web Audio 合成，无需音频文件） ====================
  const SoundFX = {
    ctx: null,
    enabled: true,
    _lastShoot: 0,
    _lastExp: 0,
    init() {
      const saved = localStorage.getItem('xcy_sound');
      this.enabled = saved === null ? true : saved === '1';
      if (this.ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch (e) { this.ctx = null; return; }
      const wake = () => { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); };
      window.addEventListener('pointerdown', wake, { once: true });
      window.addEventListener('keydown', wake, { once: true });
    },
    setEnabled(v) { this.enabled = v; localStorage.setItem('xcy_sound', v ? '1' : '0'); },
    tone(freq, dur, type, vol, slideTo) {
      if (!this.enabled || !this.ctx) return;
      const t = this.ctx.currentTime;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(slideTo, 1), t + dur);
      g.gain.setValueAtTime(vol || 0.15, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    },
    noise(dur, vol) {
      if (!this.enabled || !this.ctx) return;
      const t = this.ctx.currentTime;
      const len = Math.floor(this.ctx.sampleRate * dur);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = this.ctx.createBufferSource(); src.buffer = buf;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(vol || 0.3, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400;
      src.connect(f); f.connect(g); g.connect(this.ctx.destination);
      src.start(t);
    },
    shoot() {
      const now = performance.now();
      if (now - this._lastShoot < 80) return;
      this._lastShoot = now;
      this.tone(880, 0.06, 'square', 0.05, 420);
    },
    hit() { this.noise(0.15, 0.25); this.tone(220, 0.2, 'sawtooth', 0.12, 80); },
    explosion() {
      const now = performance.now();
      if (now - this._lastExp < 60) return;
      this._lastExp = now;
      this.noise(0.35, 0.3); this.tone(120, 0.3, 'sawtooth', 0.18, 40);
    },

    shield() { this.tone(320, 0.22, 'triangle', 0.16, 640); },

    },
  };

  // Phaser Graphics 无 fillPolygon 方法，需手动走 Path 填充多边形
  function fillPoly(g, pts) {
    g.beginPath();
    g.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
    g.closePath();
    g.fillPath();
  }

  // ==================== 辅助：等比例缩放 ====================
  function fit(sprite, targetH) {
    const h = (sprite.frame && sprite.frame.height) || 60;
    sprite.setScale(targetH / h);
  }

  // ==================== 重置单局状态 ====================
  function resetRun() {
    GameState.level = 1;
    GameState.bossCycle = 0;
    GameState.firepowerLevel = 0;
    GameState.attackSpeed = 1.0;
    GameState.drone = false;
    GameState.shield = false;
    GameState.score = 0;
    GameState.victory = false;
    GameState.bombs = 2;
    GameState.p1Score = 0;
    GameState.p2Score = 0;
  }

  // ==================== MenuScene（标题界面） ====================
  class MenuScene extends Phaser.Scene {
    constructor() { super('MenuScene'); }
    create() {
      this.bg = this.add.tileSprite(360, 640, 720, 1280, 'bg_tile').setAlpha(0.25);
      this.add.particles(0, 0, 'particle', {
        x: { min: 0, max: 720 }, y: { min: 0, max: 1280 },
        speedY: 90, scale: { start: 0.5, end: 0 }, lifespan: 6000, quantity: 20, blendMode: 'ADD', tint: [0xffffff, 0x88ccff],
      });

      this.add.text(360, 180, '飞机大战', {
        fontFamily: 'Orbitron, Microsoft YaHei, monospace', fontSize: '72px',
        color: '#00e5ff', stroke: '#002233', strokeThickness: 6,
      }).setOrigin(0.5);
      this.add.text(360, 242, 'XCY 版', {
        fontFamily: 'Microsoft YaHei, monospace', fontSize: '20px', color: '#ff3366',
      }).setOrigin(0.5);

      // 战机展示（自动轮播）
      const showOrder = ['player_default', 'player_lightning'];
      const showNames = ['默认战机', '闪电战机'];
      this.planePreview = this.add.image(360, 310, showOrder[0]).setDepth(5);
      fit(this.planePreview, 150);
      this.planeName = this.add.text(360, 396, showNames[0], {
        fontFamily: 'Microsoft YaHei, monospace', fontSize: '22px', color: '#00e5ff',
      }).setOrigin(0.5);
      this.planeShowIndex = 0;
      this.time.addEvent({ delay: 1600, loop: true, callback: () => {
        this.planeShowIndex = (this.planeShowIndex + 1) % showOrder.length;

  // ==================== CharacterSelectScene（选择战机） ====================
  class CharacterSelectScene extends Phaser.Scene {
    constructor() { super('CharacterSelectScene'); }
    create() {
      const isCoop = GameState.mode === 'coop';
      this.bg = this.add.tileSprite(360, 640, 720, 1280, 'bg_tile').setAlpha(0.25);
      this.add.text(360, 130, '选择战机', {
        fontFamily: 'Orbitron, Microsoft YaHei, monospace', fontSize: '48px', color: '#00e5ff', stroke: '#002233', strokeThickness: 4,
      }).setOrigin(0.5);

      const slots = isCoop
        ? [{ key: 'player1', label: '1P', labelColor: '#00e5ff', x: 240 },
           { key: 'player2', label: '2P', labelColor: '#ff3366', x: 480 }]
        : [{ key: 'selectedPlane', label: '', labelColor: '#00e5ff', x: 360 }];

      this.slots = slots.map(s => this.drawSlot(s));

      this.drawBtn(150, 1130, '返回', 0x8888aa, () => { SoundFX.click(); this.scene.start('MenuScene'); });
      this.drawBtn(570, 1130, '下一步', 0x00e5ff, () => this.next());

      this.input.keyboard.on('keydown-ESC', () => this.scene.start('MenuScene'));
      this.input.keyboard.on('keydown-SPACE', () => this.next());
      this.input.keyboard.on('keydown-ENTER', () => this.next());
    }

    drawSlot(s) {
      const g = this.add.graphics();
      g.fillStyle(0xffffff, 0.05);
      g.fillRoundedRect(s.x - 110, 230, 220, 350, 14);
      g.lineStyle(2, s.labelColor === '#ff3366' ? 0xff3366 : 0x00e5ff, 0.9);
      g.strokeRoundedRect(s.x - 110, 230, 220, 350, 14);

      if (s.label) {
        this.add.text(s.x, 258, s.label, {
          fontFamily: 'Orbitron, Microsoft YaHei, monospace', fontSize: '24px', color: s.labelColor,
        }).setOrigin(0.5);
      }

      const img = this.add.image(s.x, 395, PLANES[GameState[s.key]].texture).setScale(0);
      fit(img, 185);
      const name = this.add.text(s.x, 515, PLANES[GameState[s.key]].name, {
        fontFamily: 'Microsoft YaHei, monospace', fontSize: '24px', color: '#ffffff',
      }).setOrigin(0.5);
      this.add.text(s.x, 548, `生命 3 · 火力 自动`, {
        fontFamily: 'Microsoft YaHei, monospace', fontSize: '13px', color: '#8888aa',
      }).setOrigin(0.5);

      const left = this.add.text(s.x - 84, 395, '<', {
        fontFamily: 'Orbitron, monospace', fontSize: '40px', color: '#00e5ff',
      }).setOrigin(0.5).setInteractive({ useHandCursor: true });
      const right = this.add.text(s.x + 84, 395, '>', {
        fontFamily: 'Orbitron, monospace', fontSize: '40px', color: '#00e5ff',
      }).setOrigin(0.5).setInteractive({ useHandCursor: true });

      const cycle = (dir) => {
        const order = ['default', 'lightning'];
        let ni = order.indexOf(GameState[s.key]);
        for (let i = 0; i < order.length; i++) {
          ni = (ni + dir + order.length) % order.length;
          if (!GameState.unlocked[order[ni]]) continue;
          if (GameState.mode === 'coop' && order[ni] === (s.key === 'player1' ? GameState.player2 : GameState.player1)) continue;
          GameState[s.key] = order[ni];
          break;
        }
        const plane = PLANES[GameState[s.key]];
        img.setTexture(plane.texture).setScale(0);
        fit(img, 185);
        name.setText(plane.name);
        SoundFX.click();
      };
      left.on('pointerdown', () => cycle(-1));
      right.on('pointerdown', () => cycle(1));

      return { s, img, name };
    }

    next() {
      SoundFX.click();
      if (GameState.mode === 'single' || GameState.mode === 'coop') {
        this.scene.start('LevelSelectScene');
      } else {
        resetRun();
        document.getElementById('xcy-logo').style.display = 'none';
        this.scene.start('GameScene');
      }
    }

    drawBtn(x, y, text, color, onClick) {
      const g = this.add.graphics();
      g.fillStyle(color, 0.2);
      g.fillRoundedRect(x - 120, y - 28, 240, 56, 10);
      g.lineStyle(2, color, 1);
      g.strokeRoundedRect(x - 120, y - 28, 240, 56, 10);
      this.add.text(x, y, text, {
        fontFamily: 'Orbitron, Microsoft YaHei, monospace', fontSize: '22px', color: '#ffffff',
      }).setOrigin(0.5);
      this.add.zone(x, y, 240, 56).setInteractive().on('pointerdown', onClick);
    }
  }

  // ==================== GameScene ====================
  class GameScene extends Phaser.Scene {
    constructor() { super('GameScene'); }

    create() {
      // 读取关卡配置（战役模式）
      this.levelCfg = (GameState.mode === 'single' || GameState.mode === 'coop')
        ? (LEVELS.find(l => l.id === GameState.selectedLevel) || LEVELS[0])
        : null;
      if (this.levelCfg) GameState.level = this.levelCfg.id;

      this.bg1 = this.add.tileSprite(360, 640, 720, 1280, 'bg_tile').setAlpha(0.3);
      this.bg2 = this.add.tileSprite(360, 640, 720, 1280, 'bg_tile').setAlpha(0.15);
      // 关卡背景色调变化
      const lt = this.levelCfg ? this.levelCfg.bgTint : 0xffffff;
      this.bg1.setTint(lt);
      this.bg2.setTint(lt);

      // 全局粒子星点
      this.add.particles(0, 0, 'particle', {
        x: { min: 0, max: 720 }, y: { min: 0, max: 1280 },
        speedY: 120, scale: { start: 0.5, end: 0 }, lifespan: 8000,
        quantity: 40, blendMode: 'ADD', tint: [0xffffff, 0x88ccff, 0xaaaaff],
      });

      this.enemies = this.physics.add.group();
      this.enemyBullets = this.physics.add.group();
      this.powerups = this.physics.add.group();

      // 注册键盘
      this.keysP1 = {
        up: this.input.keyboard.addKey(KEY.W), down: this.input.keyboard.addKey(KEY.S),
        left: this.input.keyboard.addKey(KEY.A), right: this.input.keyboard.addKey(KEY.D),
        fire: this.input.keyboard.addKey(KEY.SPACE),
      };
      this.cursors = this.input.keyboard.createCursorKeys();
      this.keyEnter = this.input.keyboard.addKey(KEY.ENTER);

      // 创建玩家
      this.players = [];
      if (GameState.mode === 'coop') {
        const p1 = this.createPlayer(GameState.player1, 250, 1050);
        p1.keys = this.keysP1; p1.isP1 = true; p1.color = 0x00e5ff;
        this.players.push(p1);
        const p2 = this.createPlayer(GameState.player2, 470, 1050);
        p2.keys = { up: this.cursors.up, down: this.cursors.down, left: this.cursors.left, right: this.cursors.right, fire: this.keyEnter };
        p2.isP1 = false; p2.color = 0xff3366;
        this.players.push(p2);
      } else {
        const p = this.createPlayer(GameState.selectedPlane, 360, 1050);
        p.keys = this.keysP1; p.isP1 = true;
        this.players.push(p);
      }

      // 僚机（若已获得）
      this.drone = null;
      if (GameState.drone) this.spawnDrone();

      this.spawnTimer = 0;
      this.spawnInterval = GameState.mode === 'endless' ? 950 : 1100;
      this.waveIndex = 0;
      this.boss = null;
      this.bossActive = false;
      this.paused = false;
      this.finished = false;

      // 连击系统
      this.combo = 0;
      this.comboTimer = 0;

      this.createHUD();
      this.showTutorial();
      this.physics.world.setBounds(0, 0, 720, 1280);

      this.input.keyboard.on('keydown-ESC', () => this.togglePause());
      this.input.keyboard.on('keydown-H', () => this.openHelp());

      // 首领挑战：开局直接刷 Boss
      if (GameState.mode === 'boss') {
        this.time.delayedCall(600, () => { if (this.scene.isActive('GameScene')) this.spawnBoss(); });
      }
    }

    createPlayer(planeKey, x, y) {
      const stats = PLANES[planeKey];
      const sp = this.physics.add.sprite(x, y, stats.texture);
      sp.setCollideWorldBounds(true);
      fit(sp, 115);
      sp.body.setCircle(18, 7, 4);
      sp.setDepth(10);
      sp.planeKey = planeKey;
      sp.lives = stats.hp;
      sp.fireRate = Math.round(stats.fireRate / GameState.attackSpeed);
      sp.fastFireRate = Math.round(sp.fireRate * 0.5);
      sp.moveSpeed = stats.moveSpeed;
      sp.color = stats.color;
      sp.lastFireTime = 0;
      sp.invincibleTimer = 0;
      sp.invincibleDuration = 1500;
      sp.score = 0;
      sp.alive = true;
      sp.bullets = this.physics.add.group({ maxSize: 500 });

      // 尾焰粒子
      this.add.particles(0, 0, 'particle', {
        x: sp.x, y: sp.y + 48, speed: { min: 40, max: 100 }, angle: { min: 70, max: 110 },
        scale: { start: 0.6, end: 0 }, lifespan: 250, quantity: 2, blendMode: 'ADD', tint: [0xff3366, 0xffd700],
      }).startFollow(sp, 0, 58);

      return sp;
    }

    spawnDrone() {
      const owner = this.players[0];
      this.drone = this.physics.add.sprite(owner.x + 40, owner.y, PLANES[owner.planeKey].texture);
      fit(this.drone, 60);
      this.drone.setDepth(9);
      this.drone.droneTimer = 0;
      this.drone.droneOwner = owner;
    }

    createHUD() {
      const g = this.add.graphics();
      g.fillStyle(0x0a0a1a, 0.75);
      g.fillRoundedRect(10, 10, 700, 60, 6);
      g.lineStyle(1, 0x00e5ff, 0.8);
      g.strokeRoundedRect(10, 10, 700, 60, 6);

      this.scoreText = this.add.text(24, 24, '分数: 0', {
        fontFamily: 'Microsoft YaHei, monospace', fontSize: '22px', color: '#00e5ff',
      });
      this.livesText = this.add.text(24, 44, '', {
        fontFamily: 'Microsoft YaHei, monospace', fontSize: '16px', color: '#ff3366',
      });
      this.waveText = this.add.text(690, 32, '波次 001', {
        fontFamily: 'Microsoft YaHei, monospace', fontSize: '16px', color: '#ff6b00',
      }).setOrigin(1, 0.5);
      this.bossBarBg = this.add.rectangle(360, 90, 500, 14, 0x330000).setVisible(false);
      this.bossBar = this.add.rectangle(360, 90, 500, 14, 0xff3366).setVisible(false);
      this.bossLabel = this.add.text(360, 66, '首领警戒', {
        fontFamily: 'Microsoft YaHei, monospace', fontSize: '16px', color: '#ff3366',
      }).setOrigin(0.5).setVisible(false);
      this.comboText = this.add.text(360, 122, '', {
        fontFamily: 'Microsoft YaHei, monospace', fontSize: '20px', color: '#ffd700', stroke: '#331100', strokeThickness: 2,
      }).setOrigin(0.5).setVisible(false);

      // 一键清屏炸弹按钮
      this.bombBtnBg = this.add.graphics();
      this.bombBtnBg.fillStyle(0xff6600, 0.15);
      this.bombBtnBg.fillCircle(640, 1160, 54);
      this.bombBtnBg.lineStyle(2, 0xff6600, 0.9);
      this.bombBtnBg.strokeCircle(640, 1160, 54);
      this.bombText = this.add.text(640, 1160, '', {
        fontFamily: 'Microsoft YaHei, monospace', fontSize: '18px', color: '#ffffff', align: 'center',
      }).setOrigin(0.5);
      this.add.zone(640, 1160, 140, 140).setInteractive({ useHandCursor: true }).on('pointerdown', () => this.useBomb());
      this.input.keyboard.on('keydown-B', () => this.useBomb());
      this.updateBombUI();
    }

    openHelp() {
      if (this.paused) return;
      this.registry.set('help_caller', 'GameScene');
      this.paused = true;
      this.physics.pause();
      this.scene.launch('HelpScene');
    }

    resumeFromHelp() {
      this.paused = false;
      this.physics.resume();
    }

    togglePause() {
      // 恢复 help 时由 HelpScene 处理，这里处理游戏内暂停
      this.paused = !this.paused;
      if (this.paused) {
        this.physics.pause();
        this.add.rectangle(360, 640, 720, 1280, 0x000000, 0.6).setDepth(200);
        this.add.text(360, 640, '已暂停\n按 ESC 继续', {
          fontFamily: 'Orbitron, Microsoft YaHei, monospace', fontSize: '28px', color: '#ffffff', align: 'center',
        }).setOrigin(0.5).setDepth(201);
      } else {
        this.physics.resume();
        // 简单清理：重建暂停遮罩（通过标记）
        this.pauseOverlay = null;
      }
    }

    update(time, delta) {
      if (this.paused) return;
      try { this.doUpdate(time, delta); }
      catch (e) { console.error('[GameScene.update]', e); }
    }

    doUpdate(time, delta) {
      if (this.finished) return;
      GameState.elapsed = (GameState.elapsed || 0) + delta;
      this.bg1.tilePositionY += 40 * delta / 1000;
      this.bg2.tilePositionY += 60 * delta / 1000;

      // 玩家逻辑
      this.players.forEach(p => {
        if (!p.alive) return;
        this.updatePlayer(p, delta);
      });

      // 僚机
      if (this.drone && this.drone.active && this.players[0].alive) {
        this.drone.x = Phaser.Math.Linear(this.drone.x, this.players[0].x + 40, 0.1);
        this.drone.y = Phaser.Math.Linear(this.drone.y, this.players[0].y, 0.1);
        this.drone.droneTimer += delta;
        if (this.drone.droneTimer >= 300) {
          this.drone.droneTimer = 0;
          this.fireBullet(this.drone.x, this.drone.y - 32, this.drone.droneOwner.bullets, -700);
        }
      }

      // 敌机生成
      if (!this.bossActive) {
        this.spawnTimer += delta;
        if (this.spawnTimer >= this.spawnInterval) {
          this.spawnTimer = 0;
          this.spawnWave();
        }
      }

      // 敌机行为
      this.enemies.getChildren().forEach(e => {
        e.shootTimer = (e.shootTimer || 0) + delta;
        if (e.shootTimer >= e.shootInterval) {
          e.shootTimer = 0;
          this.enemyShoot(e);
        }
        e.tauntTimer -= delta;
        if (e.tauntTimer <= 0) {
          e.tauntTimer = Phaser.Math.Between(3500, 9000);
          this.showTaunt(e);
        }
        if (e.y > 1350) e.destroy();
      });

      // Boss 逻辑
      if (this.boss && this.boss.active) this.updateBoss(this.boss, delta);

      // 碰撞
      this.players.forEach(p => {
        if (!p.alive) return;
        this.physics.overlap(p.bullets, this.enemies, (b, e) => {
          b.destroy(); if (!e.active) return;
          e.hp -= 1;
          if (e.hp <= 0) { this.killEnemy(e, p); }
        });
        this.physics.overlap(p, this.enemyBullets, (_p, eb) => {
          eb.destroy(); this.hitPlayer(p);
        });
        this.physics.overlap(p, this.enemies, (_p, e) => {
          if (e.active) { e.hp = 0; this.killEnemy(e, p); this.hitPlayer(p); }
        });
        this.physics.overlap(p, this.powerups, (_p, pw) => {
          this.collectPowerup(p, pw);
        });
        // Boss 碰撞
        if (this.boss && this.boss.active) {
          this.physics.overlap(p.bullets, this.boss, (b, boss) => {
            b.destroy(); this.damageBoss(boss, 1, p);
          });
          this.physics.overlap(p, this.boss, (_p, boss) => { this.hitPlayer(p); });
        }
      });

      // 越界清理
      this.players.forEach(p => {
        p.bullets.getChildren().forEach(b => { if (b.y < -20) b.destroy(); });
      });
      this.enemyBullets.getChildren().forEach(b => { if (b.y > 1300 || b.x < -20 || b.x > 740) b.destroy(); });
      this.powerups.getChildren().forEach(pw => { if (pw.y > 1350) pw.destroy(); });

      // 连击倒计时（3 秒无击杀则重置）
      if (this.comboTimer > 0) {
        this.comboTimer -= delta;
        if (this.comboTimer <= 0) this.combo = 0;
      }

      this.updateHUD();
    }

    updatePlayer(p, delta) {
      // 无敌闪烁
      if (p.invincibleTimer > 0) {
        p.invincibleTimer -= delta;
        p.setAlpha(Math.floor(p.invincibleTimer / 80) % 2 === 0 ? 0.4 : 1);
      } else {
        p.setAlpha(1);
      }

      // 移动
      let vx = 0, vy = 0;
      if (p.keys.left.isDown) vx -= 1;
      if (p.keys.right.isDown) vx += 1;
      if (p.keys.up.isDown) vy -= 1;
      if (p.keys.down.isDown) vy += 1;

      // 单人鼠标跟随（无键盘时）
      if (GameState.mode !== 'coop' && (vx === 0 && vy === 0)) {
        const ap = this.input && this.input.activePointer;
        if (ap && ap.isDown) {
          const dx = ap.worldX - p.x, dy = ap.worldY - p.y;
          if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
            const d = Math.sqrt(dx * dx + dy * dy);
            const step = Math.min(d, p.moveSpeed * delta / 1000);
            p.x += (dx / d) * step; p.y += (dy / d) * step;
          }
        }
      }

      if (vx !== 0 || vy !== 0) {
        const len = Math.sqrt(vx * vx + vy * vy);
        p.x += (vx / len) * p.moveSpeed * delta / 1000;
        p.y += (vy / len) * p.moveSpeed * delta / 1000;
      }

      // 射击
      p.lastFireTime += delta;
      const fast = p.keys.fire.isDown;
      const rate = fast ? p.fastFireRate : p.fireRate;
      if (p.lastFireTime >= rate) {
        p.lastFireTime = 0;
        this.firePlayer(p);
      }
    }

    firePlayer(p) {
      SoundFX.shoot();
      const level = GameState.firepowerLevel;
      const y = p.y - 58;
      if (level >= 5) {
        // 五发扇形 + 两侧斜射
        this.fireBullet(p.x, y, p.bullets, -720, 0);
        this.fireBullet(p.x - 10, y, p.bullets, -720, -130);
        this.fireBullet(p.x + 10, y, p.bullets, -720, 130);
        this.fireBullet(p.x - 24, y, p.bullets, -720, -240);
        this.fireBullet(p.x + 24, y, p.bullets, -720, 240);
      } else if (level >= 3) {
        // 三发散射
        this.fireBullet(p.x, y, p.bullets, -720, 0);
        this.fireBullet(p.x - 14, y, p.bullets, -720, -110);
        this.fireBullet(p.x + 14, y, p.bullets, -720, 110);
      } else {
        // 双发直射
        this.fireBullet(p.x - 8, y, p.bullets, -720, 0);
        this.fireBullet(p.x + 8, y, p.bullets, -720, 0);
      }
    }

    fireBullet(x, y, group, vy, vx) {
      vx = vx || 0;
      const b = this.physics.add.image(x, y, 'bullet_normal');
      b.setVelocity(vx, vy);
      b.setDepth(12);
      b.body.setCircle(8);
      group.add(b);
    }

    enemyShoot(e) {
      const eb = this.physics.add.image(e.x, e.y + 20, 'bullet_enemy');
      eb.setVelocity(0, 300);
      eb.setDepth(11);
      eb.body.setCircle(8);
      this.enemyBullets.add(eb);
    }

    spawnWave() {
      // 首领挑战模式不刷普通波（Boss 由 create/defeatBoss 触发）
      if (GameState.mode === 'boss') return;

      this.waveIndex++;

      // 无尽模式：波次越高，刷得越快
      if (GameState.mode === 'endless') {
        this.spawnInterval = Math.max(320, 950 - this.waveIndex * 30);
        if (this.waveIndex % 12 === 0) { this.spawnBoss(); return; }
      } else if (this.levelCfg) {
        // 战役模式：刷满 waves 波后进入 Boss
        if (this.waveIndex >= this.levelCfg.waves) {
          this.spawnBoss(this.levelCfg.boss);
          return;
        }
      }

      let type = 'enemy_scout';
      if (this.waveIndex % 5 === 0) type = 'enemy_elite';
      else if (this.waveIndex % 3 === 0) type = 'enemy_heavy';
      else if (this.waveIndex % 2 === 0) type = 'enemy_fighter';

      const count = Math.min(3 + Math.floor(this.waveIndex / 3), GameState.mode === 'endless' ? 14 : 10);
      const formation = this.waveIndex % 4;
      if (formation === 0) this.formationLine(type, count);
      else if (formation === 1) this.formationV(type, count);
      else if (formation === 2) this.formationCircle(type, count);
      else this.formationSnake(type, count);
    }

    formationLine(type, count) {
      const spacing = 55;
      const startX = 360 - ((count - 1) * spacing) / 2;
      for (let i = 0; i < count; i++) {
        this.spawnEnemy(type, startX + i * spacing + Phaser.Math.Between(-8, 8), -40);
      }
    }

    formationV(type, count) {
      const half = Math.floor(count / 2);
      for (let i = 0; i < count; i++) {
        const off = i - half;
        this.spawnEnemy(type, 360 + off * 50, -40 - Math.abs(off) * 45);
      }
    }

    formationCircle(type, count) {
      for (let i = 0; i < count; i++) {
        const a = (i / count) * Math.PI * 2;
        this.spawnEnemy(type, 360 + Math.cos(a) * 140, -80 + Math.sin(a) * 140);
      }
    }

    formationSnake(type, count) {
      for (let i = 0; i < count; i++) {
        this.spawnEnemy(type, 360 + Phaser.Math.Between(-45, 45), -40 - i * 45);
      }
    }

    spawnEnemy(type, x, y) {
      const e = this.physics.add.image(x, y, type);
      const defs = {
        enemy_scout: { hp: 1, score: 100, shoot: 2600 },
        enemy_fighter: { hp: 3, score: 300, shoot: 2000 },
        enemy_heavy: { hp: 8, score: 800, shoot: 1500 },
        enemy_elite: { hp: 15, score: 2000, shoot: 1200 },
      };
      const d = defs[type];
      let hpScale = 1, spScale = 1;
      if (GameState.mode === 'endless') {
        hpScale = 1 + Math.floor(this.waveIndex / 5) * 0.35;
        spScale = 1 + Math.min(this.waveIndex * 0.02, 1);
      } else if (this.levelCfg) {
        hpScale = this.levelCfg.enemyHpMul || 1;
        spScale = this.levelCfg.enemySpeedMul || 1;
      }
      e.setVelocity(Phaser.Math.Between(-25, 25), Phaser.Math.Between(100, 170) * spScale);
      e.setDepth(9);
      e.body.setCircle(14);
      e.hp = Math.ceil(d.hp * hpScale); e.score = d.score;
      let shoot = d.shoot;
      if (GameState.mode === 'endless') shoot = Math.max(500, shoot - this.waveIndex * 20);
      e.shootInterval = shoot + Phaser.Math.Between(-400, 400);
      e.shootTimer = Phaser.Math.Between(300, 1200);
      e.tauntTimer = Phaser.Math.Between(1800, 6000);
      this.enemies.add(e);
    }

    killEnemy(e, player) {
      if (!e.active) return;
      SoundFX.explosion();
      this.combo += 1;
      this.comboTimer = 3000;
      const multi = Math.min(1 + Math.floor(this.combo / 5), 5);
      const gained = e.score * multi;
      player.score += gained;
      GameState.score += gained;
      if (multi > 1) {
        const cm = this.add.text(e.x, e.y - 20, `${this.combo} 连击 ×${multi}`, {
          fontFamily: 'Microsoft YaHei, monospace', fontSize: '18px', color: '#ffd700', stroke: '#331100', strokeThickness: 2,
        }).setOrigin(0.5).setDepth(50);
        this.tweens.add({ targets: cm, y: cm.y - 40, alpha: 0, duration: 600, onComplete: () => cm.destroy() });
      }
      this.add.particles(e.x, e.y, 'particle', {
        speed: { min: 80, max: 220 }, scale: { start: 0.9, end: 0 },
        lifespan: 350, quantity: 12, blendMode: 'ADD', tint: [0xffd700, 0xff3366, 0xffffff],
      });
      // 掉落道具
      const r = Math.random();
      if (r < 0.05) this.spawnPowerup(e.x, e.y, 'powerup_heal');
      else if (r < 0.13) this.spawnPowerup(e.x, e.y, 'powerup_firepower');
      else if (r < 0.17) this.spawnPowerup(e.x, e.y, 'powerup_shield');
      else if (r < 0.20) this.spawnPowerup(e.x, e.y, 'powerup_bomb');
      e.destroy();
    }

    spawnPowerup(x, y, key) {
      const pw = this.physics.add.image(x, y, key);
      pw.setVelocity(0, 120);
      pw.setDepth(9);
      this.powerups.add(pw);
    }

    collectPowerup(p, pw) {
      const k = pw.texture.key;
      pw.destroy();
      if (k === 'powerup_heal') { p.lives = Math.min(p.lives + 1, PLANES[p.planeKey].hp); this.flashMsg(p, '+1 血量', '#00ff88'); SoundFX.powerup(); }
      else if (k === 'powerup_firepower') { GameState.firepowerLevel = Math.min(GameState.firepowerLevel + 1, 5); this.flashMsg(p, '+ 火力', '#ffd700'); SoundFX.powerup(); }
      else if (k === 'powerup_shield') { this.flashMsg(p, '+ 护盾', '#00aaff'); this.activateShield(p); SoundFX.shield(); }
      else if (k === 'powerup_bomb') { GameState.bombs++; this.flashMsg(p, '+1 炸弹', '#ff6600'); SoundFX.powerup(); this.updateBombUI(); }
    }

    activateShield(p) { /* 简化：立即回复一点护盾 = 无敌时间 */
      p.invincibleTimer = Math.max(p.invincibleTimer, 2500);
    }

    clearScreen() {
      SoundFX.bomb();
      this.enemies.getChildren().forEach(e => { e.hp = 0; this.killEnemy(e, this.players[0]); });
      // 全屏闪光 + 震动 + 冲击波
      this.cameras.main.flash(250, 255, 255, 255);
      this.cameras.main.shake(350, 0.03);
      const ring = this.add.circle(360, 640, 20, 0xffffff, 0.85).setDepth(40);
      this.tweens.add({ targets: ring, scale: 45, alpha: 0, duration: 500, onComplete: () => ring.destroy() });
    }

    useBomb() {
      if (GameState.bombs <= 0) return;
      GameState.bombs--;
      this.clearScreen();
      this.updateBombUI();
    }

    updateBombUI() {
      if (!this.bombText) return;
      this.bombText.setText('清屏\n' + '💣×' + GameState.bombs);
      if (this.bombBtnBg) this.bombBtnBg.setAlpha(GameState.bombs > 0 ? 1 : 0.35);
    }

    showTaunt(e) {
      if (this.paused || this.finished || !e.active) return;
      const text = TAUNTS[Math.floor(Math.random() * TAUNTS.length)];
      const w = Math.max(60, text.length * 15 + 24);
      const bubble = this.add.container(e.x, e.y - 34);
      const bg = this.add.graphics();
      bg.fillStyle(0xffffff, 0.95);
      bg.fillRoundedRect(-w / 2, -14, w, 28, 10);
      bg.fillTriangle(-5, 13, 5, 13, 0, 22);
      const txt = this.add.text(0, 0, text, {
        fontFamily: 'Microsoft YaHei, monospace', fontSize: '15px', color: '#333333',
      }).setOrigin(0.5);
      bubble.add([bg, txt]);
      bubble.setDepth(60);
      this.tweens.add({ targets: bubble, y: bubble.y - 50, alpha: 0, duration: 1500, delay: 700, onComplete: () => bubble.destroy() });
    }

    hitPlayer(p) {
      if (p.invincibleTimer > 0) return;
      p.invincibleTimer = p.invincibleDuration;
      SoundFX.hit();
      p.lives -= 1;
      GameState.lives = p.lives;
      this.cameras.main.shake(200, 0.008);
      this.add.particles(p.x, p.y, 'particle', {
        speed: { min: 100, max: 280 }, scale: { start: 1, end: 0 },
        lifespan: 400, quantity: 18, blendMode: 'ADD', tint: [0xffd700, 0xff3366, 0xffffff],
      });
      if (p.lives <= 0) {
        p.alive = false;
        p.setVisible(false);
      }
      // 判定游戏结束
      if (this.players.every(pl => !pl.alive)) {
        this.gameOver();
      }
    }

    flashMsg(p, text, color) {
      const m = this.add.text(p.x, p.y - 40, text, {
        fontFamily: 'Microsoft YaHei, monospace', fontSize: '18px', color,
      }).setOrigin(0.5).setDepth(50);
      this.tweens.add({ targets: m, y: m.y - 50, alpha: 0, duration: 700, onComplete: () => m.destroy() });
    }

    // ===== Boss =====
    chooseBoss() {
      if (GameState.mode === 'boss') {
        const list = ['guardian', 'storm', 'juggernaut', 'leviathan', 'devourer'];
        return list[GameState.bossCycle % list.length];
      }
      if (GameState.mode === 'endless') {
        return (this.waveIndex % 24 === 0) ? 'leviathan' : 'guardian';
      }
      return this.levelCfg ? this.levelCfg.boss : 'guardian';
    }

    spawnBoss(type) {
      type = type || this.chooseBoss();
      this.bossActive = true;
      this.enemies.getChildren().forEach(e => e.destroy());
      const def = BOSS_DEFS[type];
      const boss = this.physics.add.image(360, -150, def.texture);
      boss.setDepth(8);
      boss.body.setCircle(def.radius, 0, 20);
      let scale = 1;
      if (GameState.mode === 'boss') scale = 1 + Math.floor(GameState.bossCycle / 2) * 0.4;
      else if (GameState.mode === 'endless') scale = 1 + Math.floor(this.waveIndex / 12) * 0.15;
      else if (this.levelCfg) scale = this.levelCfg.bossHpMul || 1;
      boss.hp = Math.round(def.hp * scale);
      boss.maxHp = boss.hp;
      boss.name = def.name;
      boss.reward = def.reward;
      boss.type = type;
      boss.pattern = def.pattern;
      boss.phase = 1;
      boss.shootTimer = 0;
      boss.spiralAngle = 0;
      boss.moveDir = 1;
      boss.tauntTimer = 2000;
      this.boss = boss;
      SoundFX.bossWarn();
      this.tweens.add({ targets: boss, y: 240, duration: 1500, ease: 'Power2' });
    }

    updateBoss(boss, delta) {
      // 左右巡逻
      boss.x += boss.moveDir * 60 * delta / 1000;
      if (boss.x < 120) boss.moveDir = 1;
      if (boss.x > 600) boss.moveDir = -1;
      boss.shootTimer += delta;
      boss.tauntTimer -= delta;
      if (boss.tauntTimer <= 0) {
        boss.tauntTimer = Phaser.Math.Between(3000, 7000);
        this.showTaunt(boss);
      }
      if (boss.type === 'leviathan') this.updateLeviathan(boss);
      else if (boss.pattern === 'storm') this.updateStorm(boss);
      else if (boss.pattern === 'juggernaut') this.updateJuggernaut(boss);
      else if (boss.pattern === 'devourer') this.updateDevourer(boss);
      else this.updateGuardian(boss);
    }

    updateGuardian(boss) {
      if (boss.phase === 1) {
        if (boss.shootTimer >= 1200) {
          boss.shootTimer = 0;
          // 扇形散弹
          for (let a = -60; a <= 60; a += 20) {
            this.bossBullet(boss.x, boss.y + 60, 90 + a);
          }
        }
        if (boss.hp <= boss.maxHp * 0.5) {
          boss.phase = 2; boss.shootTimer = 0;
          this.flashMsg(boss, '狂暴!', '#ff3366');
        }
      } else {
        // 阶段 2：螺旋阵
        if (boss.shootTimer >= 850) {
          boss.shootTimer = 0;
          boss.spiralAngle += 30;
          for (let i = 0; i < 4; i++) {
            this.bossBullet(boss.x, boss.y + 60, boss.spiralAngle + i * 90);
          }
        }
      }
    }

    updateLeviathan(boss) {
      const p = this.players.find(pl => pl.alive);
      if (boss.phase === 1) {
        // 广角扇形 + 瞄准玩家
        if (boss.shootTimer >= 1100) {
          boss.shootTimer = 0;
          for (let a = -70; a <= 70; a += 14) this.bossBullet(boss.x, boss.y + 70, 90 + a);
          if (p) {
            const ang = Phaser.Math.RadToDeg(Math.atan2(p.y - boss.y, p.x - boss.x));
            this.bossBullet(boss.x, boss.y + 70, ang, 340);
          }
        }
        if (boss.hp <= boss.maxHp * 0.66) {
          boss.phase = 2; boss.shootTimer = 0;
          this.flashMsg(boss, '弹幕矩阵!', '#ff3366');
        }
      } else if (boss.phase === 2) {
        // 全屏弹幕矩阵：横向一排下落
        if (boss.shootTimer >= 800) {
          boss.shootTimer = 0;
          for (let x = 60; x <= 660; x += 60) {
            const idx = Math.floor(x / 60);
            const bx = this.physics.add.image(x, boss.y + 70, 'bullet_enemy');
            bx.setVelocity(0, 300 + (idx % 3) * 60);
            bx.setDepth(11); bx.body.setCircle(8);
            this.enemyBullets.add(bx);
          }
        }
        if (boss.hp <= boss.maxHp * 0.33) {
          boss.phase = 3; boss.shootTimer = 0;
          this.flashMsg(boss, '极度狂暴!', '#ff3366');
        }
      } else {
        // 螺旋 + 追踪
        if (boss.shootTimer >= 550) {
          boss.shootTimer = 0;
          boss.spiralAngle += 20;
          for (let i = 0; i < 6; i++) this.bossBullet(boss.x, boss.y + 70, boss.spiralAngle + i * 60);
          if (p) {
            const ang = Phaser.Math.RadToDeg(Math.atan2(p.y - boss.y, p.x - boss.x));
            this.bossBullet(boss.x, boss.y + 70, ang, 380);
          }
        }
      }
    }

    bossBullet(x, y, angleDeg, speed) {
      const bx = this.physics.add.image(x, y, 'bullet_enemy');
      const rad = Phaser.Math.DegToRad(angleDeg);
      const s = speed || 260;
      bx.setVelocity(Math.cos(rad) * s, Math.sin(rad) * s);
      bx.setDepth(11);
      bx.body.setCircle(8);
      this.enemyBullets.add(bx);
    }

    updateStorm(boss) {
      const p = this.players.find(pl => pl.alive);
      if (boss.phase === 1) {
        if (boss.shootTimer >= 700) {
          boss.shootTimer = 0;
          if (p) {
            const ang = Phaser.Math.RadToDeg(Math.atan2(p.y - boss.y, p.x - boss.x));
            for (let i = -1; i <= 1; i++) this.bossBullet(boss.x, boss.y + 50, ang + i * 13, 360);
          }
        }
        if (boss.hp <= boss.maxHp * 0.5) {
          boss.phase = 2; boss.shootTimer = 0;
          this.flashMsg(boss, '狂风骤起!', '#00c8ff');
        }
      } else {
        if (boss.shootTimer >= 500) {
          boss.shootTimer = 0;
          for (let a = -80; a <= 80; a += 16) this.bossBullet(boss.x, boss.y + 50, 90 + a, 330);
        }
      }
    }

    updateJuggernaut(boss) {
      if (boss.phase === 1) {
        if (boss.shootTimer >= 1400) {
          boss.shootTimer = 0;
          for (let i = 0; i < 3; i++) this.bossBullet(boss.x - 40 + i * 40, boss.y + 60, 90, 220);
        }
        if (boss.hp <= boss.maxHp * 0.6) {
          boss.phase = 2; boss.shootTimer = 0;
          this.flashMsg(boss, '炮台全开!', '#ff8800');
        }
      } else {
        if (boss.shootTimer >= 900) {
          boss.shootTimer = 0;
          for (let i = 0; i < 16; i++) this.bossBullet(boss.x, boss.y + 60, i * 22.5, 200);
        }
      }
    }

    updateDevourer(boss) {
      const p = this.players.find(pl => pl.alive);
      if (boss.shootTimer >= 600) {
        boss.shootTimer = 0;
        boss.spiralAngle += 24;
        for (let i = 0; i < 8; i++) this.bossBullet(boss.x, boss.y + 60, boss.spiralAngle + i * 45, 260);
        if (p) {
          const ang = Phaser.Math.RadToDeg(Math.atan2(p.y - boss.y, p.x - boss.x));
          this.bossBullet(boss.x, boss.y + 60, ang, 380);
        }
      }
    }

    damageBoss(boss, dmg, player) {
      if (!boss.active) return;
      boss.hp -= dmg;
      player.score += 10;
      GameState.score += 10;
      boss.setTint(0xffffff);
      this.time.delayedCall(40, () => { if (boss.active) boss.clearTint(); });
      if (boss.hp <= 0) {
        this.defeatBoss(boss, player);
      }
    }

    defeatBoss(boss, player) {
      SoundFX.bossDefeat();
      const bx = boss.x, by = boss.y, reward = boss.reward || 5000;
      boss.destroy(); this.boss = null; this.bossActive = false;
      player.score += reward; GameState.score += reward;
      if (GameState.mode === 'coop') {
        GameState.p1Score = this.players[0].score;
        GameState.p2Score = this.players[1].score;
      }
      this.cameras.main.shake(400, 0.02);
      this.add.particles(bx, by, 'particle', {
        speed: { min: 100, max: 400 }, scale: { start: 1.5, end: 0 },
        lifespan: 600, quantity: 60, blendMode: 'ADD', tint: [0xff3366, 0x00e5ff, 0xffffff],
      });

      if (GameState.mode === 'boss') {
        // 首领挑战：击败后继续刷下一个 Boss
        GameState.bossCycle++;
        this.time.delayedCall(1500, () => { if (this.scene.isActive('GameScene')) this.spawnBoss(); });
        return;
      }
      if (GameState.mode === 'endless') return; // 无尽模式：继续刷波

      // 战役模式：通关 → 解锁下一关 → 胜利 CG
      const nextId = this.levelCfg.id + 1;
      if (nextId <= LEVELS.length && GameState.unlockedLevel < nextId) {
        GameState.unlockedLevel = nextId;
        localStorage.setItem('xcy_unlocked_level', String(nextId));
      }
      GameState.victory = true;
      this.finished = true;
      this.time.delayedCall(1200, () => this.scene.start('CgScene'));
    }

    showTutorial() {
      if (GameState.level !== 1) return;
      const tips = [
        '使用 W/A/S/D 或方向键移动',
        '战机自动射击，按住空格加速',
        '拾取金色道具提升火力',
        '按 B 键或点击右下角清屏炸弹',
        '按 H 键随时查看操作说明',
      ];
      tips.forEach((tip, i) => {
        this.time.delayedCall(1500 + i * 2600, () => {
          if (this.scene.isActive('GameScene')) this.showTip(tip);
        });
      });
    }

    showTip(text) {
      const tip = this.add.text(360, 520, text, {
        fontFamily: 'Microsoft YaHei, monospace', fontSize: '26px', color: '#00e5ff',
        backgroundColor: 'rgba(10,10,26,0.8)', padding: { x: 18, y: 10 },
      }).setOrigin(0.5).setDepth(100).setAlpha(0);
      this.tweens.add({
        targets: tip, alpha: 1, duration: 300, yoyo: true, hold: 2000,
        onComplete: () => tip.destroy(),
      });
    }

    gameOver() {
      SoundFX.gameover();
      if (GameState.mode === 'coop') {
        GameState.p1Score = this.players[0].score;
        GameState.p2Score = this.players[1].score;
      }
      this.time.delayedCall(800, () => {
        this.scene.start('GameOverScene');
      });
    }

    updateHUD() {
      let total = 0;
      this.players.forEach(p => total += p.score);
      this.scoreText.setText(`分数: ${this.players.length > 1 ? total : GameState.score}`);
      if (GameState.mode !== 'coop') {
        this.livesText.setText(`血量: ${'❤'.repeat(Math.max(0, this.players[0].lives))}`);
      } else {
        const p1 = this.players[0], p2 = this.players[1];
        this.livesText.setText(`P1 ${'❤'.repeat(Math.max(0, p1.lives))}  P2 ${'❤'.repeat(Math.max(0, p2.lives))}`);
      }
      if (GameState.mode === 'boss') {
        this.waveText.setText(`首领 ${GameState.bossCycle + 1}`);
      } else {
        this.waveText.setText(`波次 ${String(this.waveIndex).padStart(3, '0')}`);
      }

      // 连击显示
      if (this.combo > 1) {
        const multi = Math.min(1 + Math.floor(this.combo / 5), 5);
        this.comboText.setText(`${this.combo} 连击 ×${multi}`);
        this.comboText.setVisible(true);
      } else {
        this.comboText.setVisible(false);
      }

      if (this.boss && this.boss.active) {
        this.bossBarBg.setVisible(true); this.bossBar.setVisible(true);
        this.bossLabel.setVisible(true);
        this.bossLabel.setText((this.boss.name || '首领') + ' 警戒');
        this.bossBar.width = 500 * (this.boss.hp / this.boss.maxHp);
        this.bossBar.x = 360 - (500 - this.bossBar.width) / 2;
      } else {
        this.bossBarBg.setVisible(false); this.bossBar.setVisible(false);
        this.bossLabel.setVisible(false);
      }
    }
  }

  // ==================== UpgradeScene（Roguelike 三选一） ====================
  class UpgradeScene extends Phaser.Scene {
    constructor() { super('UpgradeScene'); }
    create() {
      GameState.level += 1;
      this.add.rectangle(360, 640, 720, 1280, 0x0a0a1a, 0.95);
      this.add.text(360, 180, '升级!', {
        fontFamily: 'Orbitron, Microsoft YaHei, monospace', fontSize: '48px', color: '#ffd700',
      }).setOrigin(0.5);
      this.add.text(360, 240, '选择 1 个强化芯片', {
        fontFamily: 'Microsoft YaHei, monospace', fontSize: '20px', color: '#8888aa',
      }).setOrigin(0.5);

      const all = [
        { key: 'fire', name: '火力强化', desc: '火力等级 +1' },
        { key: 'speed', name: '攻速强化', desc: '射击间隔 -15%' },
        { key: 'drone', name: '僚机', desc: '获得一架僚机' },
        { key: 'heal', name: '生命恢复', desc: '全员恢复 1 血量' },
        { key: 'shield', name: '护盾', desc: '开局获得护盾' },
      ];
      this.shuffle(all);
      const picks = all.slice(0, 3);
      const xs = [150, 360, 570];
      picks.forEach((pick, i) => {
        const x = xs[i];
        const card = this.add.graphics();
        card.fillStyle(0x00e5ff, 0.1);
        card.fillRoundedRect(x - 95, 380, 190, 320, 12);
        card.lineStyle(2, 0x00e5ff, 0.8);
        card.strokeRoundedRect(x - 95, 380, 190, 320, 12);
        this.add.text(x, 470, pick.name, {
          fontFamily: 'Microsoft YaHei, monospace', fontSize: '24px', color: '#ffffff',
        }).setOrigin(0.5);
        this.add.text(x, 520, pick.desc, {
          fontFamily: 'Microsoft YaHei, monospace', fontSize: '16px', color: '#ff3366', align: 'center',
        }).setOrigin(0.5);
        const zone = this.add.zone(x, 540, 190, 320).setInteractive();
        zone.on('pointerdown', () => this.apply(pick));
      });
    }
    shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } }
    apply(pick) {
      SoundFX.levelup();
      switch (pick.key) {
        case 'fire': GameState.firepowerLevel = Math.min(GameState.firepowerLevel + 1, 5); break;
        case 'speed': GameState.attackSpeed = Math.min(GameState.attackSpeed + 0.15, 2.0); break;
        case 'drone': GameState.drone = true; break;
        case 'heal': break; // 回血在下一关创建时体现
        case 'shield': GameState.shield = true; break;
      }
      this.scene.start('GameScene');
    }
  }

  // ==================== GameOverScene（结算界面） ====================
  class GameOverScene extends Phaser.Scene {
    constructor() { super('GameOverScene'); }
    create() {
      document.getElementById('xcy-logo').style.display = '';
      const isCoop = GameState.mode === 'coop';
      const total = isCoop ? (GameState.p1Score || 0) + (GameState.p2Score || 0) : GameState.score;
      const isNewHigh = total > GameState.highScore;
      if (isNewHigh) { GameState.highScore = total; localStorage.setItem('xcy_high_score', String(total)); }

      this.add.rectangle(360, 640, 720, 1280, 0x0a0a1a, 0.92);
      this.add.text(360, 200, '游戏结束', {
        fontFamily: 'Orbitron, Microsoft YaHei, monospace', fontSize: '52px', color: '#ff3366', stroke: '#330011', strokeThickness: 3,
      }).setOrigin(0.5);

      if (isCoop) {
        const p1 = GameState.p1Score || 0, p2 = GameState.p2Score || 0;
        this.add.text(200, 330, 'P1', { fontFamily: 'Orbitron, Microsoft YaHei, monospace', fontSize: '28px', color: '#00e5ff' }).setOrigin(0.5);
        this.add.text(200, 380, String(p1), { fontFamily: 'Microsoft YaHei, monospace', fontSize: '40px', color: '#ffffff' }).setOrigin(0.5);
        this.add.text(520, 330, 'P2', { fontFamily: 'Orbitron, Microsoft YaHei, monospace', fontSize: '28px', color: '#ff3366' }).setOrigin(0.5);
        this.add.text(520, 380, String(p2), { fontFamily: 'Microsoft YaHei, monospace', fontSize: '40px', color: '#ffffff' }).setOrigin(0.5);
        const mvp = p1 >= p2 ? 'P1' : 'P2';
        this.add.text(360, 470, `最佳 = ${mvp}`, { fontFamily: 'Orbitron, Microsoft YaHei, monospace', fontSize: '26px', color: '#ffd700' }).setOrigin(0.5);
        this.add.text(360, 520, `总分: ${total}`, { fontFamily: 'Microsoft YaHei, monospace', fontSize: '22px', color: '#00e5ff' }).setOrigin(0.5);
      } else {
        this.add.text(360, 330, `分数: ${GameState.score}`, { fontFamily: 'Microsoft YaHei, monospace', fontSize: '36px', color: '#00e5ff' }).setOrigin(0.5);
      }

      if (isNewHigh) {
        const t = this.add.text(360, 590, '★ 新纪录 ★', { fontFamily: 'Orbitron, Microsoft YaHei, monospace', fontSize: '22px', color: '#ffd700' }).setOrigin(0.5);
        this.tweens.add({ targets: t, alpha: { from: 0.5, to: 1 }, duration: 600, yoyo: true, repeat: -1 });
      } else {
        this.add.text(360, 590, `最高: ${GameState.highScore}`, { fontFamily: 'Microsoft YaHei, monospace', fontSize: '20px', color: '#ffd700' }).setOrigin(0.5);
      }

      this.drawBtn(360, 720, '重新开始', () => this.doRestart());
      this.drawBtn(360, 820, '返回菜单', () => { GameState.mode = 'single'; this.scene.start('MenuScene'); });

      this.input.keyboard.on('keydown-SPACE', () => this.doRestart());
    }
    doRestart() {
      SoundFX.click();
      resetRun();
      document.getElementById('xcy-logo').style.display = 'none';
      this.scene.start('GameScene');
    }
    drawBtn(x, y, text, onClick) {
      const bg = this.add.graphics();
      bg.fillStyle(0x00e5ff, 0.15);
      bg.fillRoundedRect(x - 140, y - 30, 280, 60, 8);
      bg.lineStyle(2, 0x00e5ff, 1);
      bg.strokeRoundedRect(x - 140, y - 30, 280, 60, 8);
      this.add.text(x, y, text, { fontFamily: 'Orbitron, Microsoft YaHei, monospace', fontSize: '22px', color: '#ffffff' }).setOrigin(0.5);
      const zone = this.add.zone(x, y, 280, 60).setInteractive();
      zone.on('pointerdown', onClick);
    }
  }

  // ==================== CgScene（胜利过场动画） ====================
  class CgScene extends Phaser.Scene {
    constructor() { super('CgScene'); }
    create() {
      this.cameras.main.setBackgroundColor('#000010');
      const lvCfg = LEVELS.find(l => l.id === GameState.selectedLevel);
      this.add.particles(0, 0, 'particle', {
        x: { min: 0, max: 720 }, y: { min: 0, max: 1280 },
        speedY: 160, scale: { start: 0.6, end: 0 }, lifespan: 5000, quantity: 30, blendMode: 'ADD', tint: [0xffffff, 0x88ccff],
      });

      // 主标题
      const title = this.add.text(360, 400, 'MISSION COMPLETE', {
        fontFamily: 'Orbitron, Microsoft YaHei, monospace', fontSize: '52px', color: '#00ff88', stroke: '#00331a', strokeThickness: 4,
      }).setOrigin(0.5).setScale(0.3).setAlpha(0);
      this.tweens.add({ targets: title, scale: 1, alpha: 1, duration: 700, ease: 'Back.easeOut' });

      const sub = this.add.text(360, 470, lvCfg ? ('关卡 ' + lvCfg.id + ' · ' + lvCfg.name) : '关卡完成', {
        fontFamily: 'Microsoft YaHei, monospace', fontSize: '30px', color: '#ffffff',
      }).setOrigin(0.5).setAlpha(0);
      this.tweens.add({ targets: sub, alpha: 1, duration: 500, delay: 400 });

      // 战机高速飞离
      const planeKey = (GameState.mode === 'coop')
        ? PLANES[GameState.player1].texture
        : PLANES[GameState.selectedPlane].texture;
      const plane = this.add.image(-120, 640, planeKey).setDepth(5);
      fit(plane, 150);
      this.add.particles(0, 0, 'particle', {
        speed: { min: 60, max: 140 }, angle: 190,
        scale: { start: 0.7, end: 0 }, lifespan: 260, quantity: 3, blendMode: 'ADD', tint: [0xff3366, 0xffd700],
      }).startFollow(plane, -30, 0);
      this.tweens.add({ targets: plane, x: 860, duration: 2200, ease: 'Cubic.easeIn', onComplete: () => plane.destroy() });

      // 中段爆炸闪屏
      this.time.delayedCall(1100, () => {
        SoundFX.explosion();
        this.cameras.main.shake(300, 0.012);
        this.add.particles(360, 620, 'particle', {
          speed: { min: 100, max: 380 }, scale: { start: 1.2, end: 0 },
          lifespan: 500, quantity: 40, blendMode: 'ADD', tint: [0x00ff88, 0x00e5ff, 0xffffff],
        });
      });

      // 分数滚动
      const scoreText = this.add.text(360, 600, '分数 0', {
        fontFamily: 'Orbitron, Microsoft YaHei, monospace', fontSize: '40px', color: '#ffd700',
      }).setOrigin(0.5).setAlpha(0);
      this.tweens.add({ targets: scoreText, alpha: 1, duration: 400, delay: 1200 });
      this.tweens.addCounter({
        from: 0, to: GameState.score, duration: 1600, delay: 1400,
        onUpdate: (tw) => { scoreText.setText('分数 ' + Math.floor(tw.getValue()).toLocaleString()); },
      });

      // 剧情文字浮现
      const story = this.add.text(360, 760, '你守护了这片星域……', {
        fontFamily: 'Microsoft YaHei, monospace', fontSize: '26px', color: '#aabbcc',
      }).setOrigin(0.5).setAlpha(0);
      this.tweens.add({ targets: story, alpha: 1, duration: 600, delay: 2400 });
      this.tweens.add({ targets: story, alpha: 0, duration: 600, delay: 4400 });

      // 进入结算（可点击跳过）
      this.time.delayedCall(5400, () => this.scene.start('ResultScene'));
      this.input.once('pointerdown', () => this.scene.start('ResultScene'));
    }
  }

  // ==================== ResultScene（胜利结算页面） ====================
  class ResultScene extends Phaser.Scene {
    constructor() { super('ResultScene'); }
    create() {
      document.getElementById('xcy-logo').style.display = '';
      const isCoop = GameState.mode === 'coop';
      const total = GameState.score;
      const isNewHigh = total > GameState.highScore;
      if (isNewHigh) { GameState.highScore = total; localStorage.setItem('xcy_high_score', String(total)); }
      const lvCfg = LEVELS.find(l => l.id === GameState.selectedLevel);
      const isLast = lvCfg && lvCfg.id === LEVELS.length;

      this.add.rectangle(360, 640, 720, 1280, 0x0a0a1a, 0.94);
      this.add.text(360, 170, '胜利!', {
        fontFamily: 'Orbitron, Microsoft YaHei, monospace', fontSize: '60px', color: '#00ff88', stroke: '#00331a', strokeThickness: 3,
      }).setOrigin(0.5);

      if (lvCfg) {
        this.add.text(360, 250, `关卡 ${lvCfg.id} · ${lvCfg.name}`, {
          fontFamily: 'Orbitron, Microsoft YaHei, monospace', fontSize: '28px', color: '#00e5ff',
        }).setOrigin(0.5);
      }
      if (isLast) {
        const t = this.add.text(360, 305, '恭喜通关全部关卡!', {
          fontFamily: 'Microsoft YaHei, monospace', fontSize: '22px', color: '#ffd700',
        }).setOrigin(0.5);
        this.tweens.add({ targets: t, alpha: { from: 0.5, to: 1 }, duration: 500, yoyo: true, repeat: -1 });
      }

      this.add.text(360, 400, `分数: ${total}`, {
        fontFamily: 'Microsoft YaHei, monospace', fontSize: '38px', color: '#ffffff',
      }).setOrigin(0.5);

      if (isCoop) {
        const p1 = GameState.p1Score || 0, p2 = GameState.p2Score || 0;
        this.add.text(220, 470, 'P1', { fontFamily: 'Orbitron, monospace', fontSize: '26px', color: '#00e5ff' }).setOrigin(0.5);
        this.add.text(220, 520, String(p1), { fontFamily: 'Microsoft YaHei, monospace', fontSize: '34px', color: '#ffffff' }).setOrigin(0.5);
        this.add.text(500, 470, 'P2', { fontFamily: 'Orbitron, monospace', fontSize: '26px', color: '#ff3366' }).setOrigin(0.5);
        this.add.text(500, 520, String(p2), { fontFamily: 'Microsoft YaHei, monospace', fontSize: '34px', color: '#ffffff' }).setOrigin(0.5);
        this.add.text(360, 585, `最佳 = ${p1 >= p2 ? 'P1' : 'P2'}`, { fontFamily: 'Orbitron, monospace', fontSize: '22px', color: '#ffd700' }).setOrigin(0.5);
      }

      if (isNewHigh) {
        const t = this.add.text(360, 560, '★ 新纪录 ★', { fontFamily: 'Orbitron, Microsoft YaHei, monospace', fontSize: '22px', color: '#ffd700' }).setOrigin(0.5);
        this.tweens.add({ targets: t, alpha: { from: 0.5, to: 1 }, duration: 500, yoyo: true, repeat: -1 });
      } else {
        this.add.text(360, 560, `最高: ${GameState.highScore}`, { fontFamily: 'Microsoft YaHei, monospace', fontSize: '20px', color: '#ffd700' }).setOrigin(0.5);
      }

      const btns = [];
      if (lvCfg && !isLast) btns.push(['下一关', () => this.nextLevel()]);
      btns.push(['返回选关', () => this.scene.start('LevelSelectScene')]);
      btns.push(['返回菜单', () => { GameState.mode = 'single'; this.scene.start('MenuScene'); }]);
      let by = 680;
      btns.forEach(([label, cb]) => { this.drawBtn(360, by, label, cb); by += 110; });

      this.input.keyboard.on('keydown-SPACE', () => { if (lvCfg && !isLast) this.nextLevel(); });
    }
    nextLevel() {
      SoundFX.click();
      GameState.selectedLevel += 1;
      resetRun();
      document.getElementById('xcy-logo').style.display = 'none';
      this.scene.start('GameScene');
    }
    drawBtn(x, y, text, onClick) {
      const bg = this.add.graphics();
      bg.fillStyle(0x00ff88, 0.15);
      bg.fillRoundedRect(x - 160, y - 30, 320, 60, 10);
      bg.lineStyle(2, 0x00ff88, 1);
      bg.strokeRoundedRect(x - 160, y - 30, 320, 60, 10);
      this.add.text(x, y, text, { fontFamily: 'Orbitron, Microsoft YaHei, monospace', fontSize: '24px', color: '#ffffff' }).setOrigin(0.5);
      const zone = this.add.zone(x, y, 320, 60).setInteractive();
      zone.on('pointerdown', onClick);
    }
  }

  // ==================== 启动 ====================
  const config = {
    type: Phaser.AUTO,
    parent: 'game-container',
    width: 720,
    height: 1280,
    backgroundColor: '#0a0a1a',
    physics: { default: 'arcade', arcade: { gravity: { x: 0, y: 0 }, debug: false } },
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: [BootScene, MenuScene, CharacterSelectScene, LevelSelectScene, HelpScene, GameScene, UpgradeScene, GameOverScene, CgScene, ResultScene],
  };

  const game = new Phaser.Game(config);
  window.__game = game;
  </script>
